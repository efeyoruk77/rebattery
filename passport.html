<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery Passport</title>
<style>
:root{--bg:#fbfbfa;--panel:#fff;--soft:#f3f3f1;--ink:#0b0b0c;--muted:#6f6f78;--line:#e6e6e3;
 --good:#16a34a;--good-bg:#f0fdf4;--warn:#b45309;--warn-bg:#fff7ed;--bad:#b91c1c;--bad-bg:#fef2f2;--chip:#f1f1ef;
 --pa:#6366f1;--pb:#f97316;--pc:#14b8a6;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#08080a;--panel:#111114;--soft:#18181c;--ink:#f5f5f4;--muted:#a1a1aa;--line:#26262b;
 --good:#4ade80;--good-bg:#0c2414;--warn:#fbbf24;--warn-bg:#2a1f0a;--bad:#f87171;--bad-bg:#2a1010;--chip:#1c1c21;
 --pa:#818cf8;--pb:#fb923c;--pc:#2dd4bf;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:20px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px}
h1{font-size:clamp(28px,7vw,40px);line-height:1.1;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:19px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:16px;margin:18px 0 8px}
.lead{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.sec{margin-top:28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.banner{border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.mark.ok{background:var(--good-bg);color:var(--good)}.mark.no{background:var(--bad-bg);color:var(--bad)}.mark.na{background:var(--chip);color:var(--muted)}
.pack-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px}
.timeline{list-style:none;padding:0;margin:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 14px 16px}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.timeline .when{font-size:13px;color:var(--muted)}
blockquote{margin:6px 0 0;padding:8px 12px;border-left:3px solid var(--line);background:var(--soft);border-radius:0 10px 10px 0;font-size:14px;overflow-wrap:anywhere}
blockquote cite{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px;margin:6px 0}
.held{font-size:14px;margin:4px 0}
.files{width:100%;border-collapse:collapse;font-size:13px}
.files td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.files td:first-child{width:45%}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.txs{list-style:none;padding:0;margin:0;font-size:14px}
.txs li{padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.error{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:14px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:8px}
.brand{justify-content:space-between;flex-wrap:wrap}.brand>span{display:flex;align-items:center;gap:10px}
.nav{display:flex;gap:8px;font-weight:500;font-size:14px}.nav a{text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--panel)}
</style>
</head>
<body>
<main id="app"><p class="muted">Reading the passport from Cardano…</p></main>
<script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const scan = tx => `https://preprod.cardanoscan.io/transaction/${encodeURIComponent(tx)}`;
const txLink = (tx, text) => `<a href="${scan(tx)}" target="_blank" rel="noopener">${esc(text ?? `${tx.slice(0, 10)}…${tx.slice(-4)}`)}</a>`;
const cellRe = /\b([A-Z0-9]+)-M(\d+)-C(\d+)\b/g, moduleRe = /\b([A-Z0-9]+)-M(\d+)\b/g;
const place = id => String(id).replace(cellRe, 'Pack $1 · Module $2 · Cell $3').replace(moduleRe, 'Pack $1 · Module $2');
const words = t => String(t).replace(/_pct$/, '').replace(/_/g, ' ').replace(/\bsoh\b/gi, 'SoH').replace(/^./, c => c.toUpperCase());
const plural = (n, w) => `${n} ${w}${Number(n) === 1 ? '' : 's'}`;
// Held-back reasons end with "; not taken apart", which the line already says.
const heldReason = r => place(String(r).replace(/;?\s*not taken apart$/, '')).replace(/^./, c => c.toUpperCase());
const colors = ['var(--pa)', 'var(--pb)', 'var(--pc)'];
const fields = f => Object.entries(f || {}).filter(([k]) => k !== 'uncertainty').map(([k, v]) => `${words(k)}: ${Array.isArray(v) ? v.join(', ') : v}${/_pct$/.test(k) ? '%' : ''}`).join(' · ');
// On the public site the data is embedded in the page; there is no "this machine".
const STATIC = Boolean(window.PASSPORT_DATA);
const brand = () => `<div class="brand"><span><span class="logo">⚡</span>Battery passport</span>${STATIC ? '<nav class="nav"><a href="../../passports.html">All passports</a><a href="../../">Review screen</a></nav>' : ''}</div>`;
const markOf = ok => ok === true ? '<span class="mark ok">✓</span>' : ok === false ? '<span class="mark no">✗</span>' : '<span class="mark na">–</span>';

function donor(d, i) {
 const used = d.modules.reduce((n, m) => n + m.cells.length, 0);
 const events = [...(d.events || [])].sort((a, b) => String(a.date).localeCompare(String(b.date)));
 const files = [...(d.documents || []).map(x => ({name: x.doc_id, kind: words(x.kind), sha: x.sha256, tx: x.anchorTx})),
  ...(d.testFiles || []).map(x => ({name: place(x.module_id), kind: words(x.kind), sha: x.sha256, tx: x.anchorTx}))];
 return `<div class="card">
  <div class="pack-head"><h2><span class="dot" style="background:${colors[i % 3]}"></span>Donor pack ${esc(d.pack)}</h2><span class="muted">${esc(plural(used, 'cell'))} from ${esc(plural(d.modules.length, 'module'))}</span></div>
  <div class="chips">${d.modules.map(m => `<span class="chip">Module ${esc(m.module_id.split('-M')[1])} · ${esc(plural(m.cells.length, 'cell'))}</span>`).join('')}</div>
  ${d.events ? `<h3>History from its documents</h3>
   ${(d.warnings || []).map(w => `<div class="warnbox">${esc(place(w.message))} <span>(${esc(w.events.join(', '))})</span></div>`).join('')}
   <ul class="timeline">${events.map(e => `<li>
    <div class="when">${esc(e.date ?? 'date unknown')} · ${esc(e.event_id)}${e.module_ids?.length ? ` · ${esc(e.module_ids.map(place).join(', '))}` : ''}</div>
    <b>${esc(words(e.type))}</b>${fields(e.fields) ? ` <span class="muted">· ${esc(fields(e.fields))}</span>` : ''}
    ${e.source ? `<blockquote>“${esc(e.source.quote)}”<cite>${esc(e.source.doc_id)}, page ${esc(e.source.page)}, line ${esc(e.source.line)}</cite></blockquote>` : ''}
   </li>`).join('')}</ul>` : `<p class="muted">The history of this pack is not shown: no draft ${STATIC ? 'published with this page' : 'on this machine'} matches its on-chain records.</p>`}
  ${d.notTakenApart.length || d.unusedCells.length ? `<h3>Not used from this pack</h3>
   ${d.notTakenApart.map(m => `<p class="held"><b>${esc(place(m.id))}</b>: not taken apart${m.reason ? `. ${esc(heldReason(m.reason))}` : ''}</p>`).join('')}
   ${d.unusedCells.length ? `<p class="held"><b>${esc(plural(d.unusedCells.length, 'cell'))} not used</b>${d.unusedCells.some(c => c.reason) ? '' : `: ${esc(d.unusedCells.map(c => place(c.id)).join(', '))}`}</p>
    ${d.unusedCells.some(c => c.reason) ? `<details><summary>Show cells and reasons</summary>${d.unusedCells.map(c => `<p class="held">${esc(place(c.id))}: ${esc(c.reason ?? '')}</p>`).join('')}</details>` : ''}` : ''}` : ''}
  ${files.length ? `<details><summary>${esc(files.length)} source files and their fingerprints on Cardano</summary><table class="files">${files.map(f => `<tr>
    <td><b>${esc(f.name)}</b><br><span class="muted">${esc(f.kind)}</span></td>
    <td><code>${esc(f.sha)}</code><br>${f.tx ? `✓ anchored in ${txLink(f.tx)}` : '<span style="color:var(--bad)">not anchored</span>'}</td></tr>`).join('')}</table></details>` : ''}
 </div>`;
}

function render(v) {
 const h = v.ess.health || {}, f = v.ess.facility || {};
 const txs = [['Passport', v.ess.passportTx], [`${v.ess.battery_id} log`, v.ess.logTx], ...v.donors.map(d => [`Donor pack ${d.pack} log`, d.logTx]),
  ...[...new Set(v.donors.flatMap(d => d.anchorTxs))].map(t => ['File fingerprints (anchor)', t])];
 document.title = `${v.ess.battery_id} Passport`;
 return `
 ${brand()}
 <h1>${esc(v.ess.battery_id)}</h1>
 <p class="lead">A second-life battery of ${esc(v.ess.count)} ${esc(v.ess.cell_model)} ${esc(v.ess.chemistry)} cells, made at <b>${esc(f.name)}</b>, ${esc(f.site)}. Built from ${esc(v.donors.length)} used EV battery packs.</p>
 ${v.payment.testRun ? '<div class="banner">Test record: written to Cardano Preprod in a test run, not from a paid job. All data is invented for the demo.</div>' : ''}
 <div class="stats">
  <div class="stat"><b>${esc(h.soh_pct)}%</b><span>second-life health (weakest cell)</span></div>
  <div class="stat"><b>${esc(h.usable_capacity_ah)} Ah</b><span>usable of ${esc(h.nominal_capacity_ah)} Ah</span></div>
  <div class="stat"><b>${esc(v.donors.length)}</b><span>donor packs</span></div>
  <div class="stat"><b>${esc(h.cells_tested_on?.join?.(', ') ?? h.cells_tested_on ?? '–')}</b><span>cells tested on</span></div>
 </div>

 <section class="sec"><h2>Checks</h2><div class="card"><ul class="checks">${v.checks.map(c => `<li>${markOf(c.ok)}<span>${esc(c.text)}</span></li>`).join('')}</ul></div>
  <p class="muted" style="font-size:13px">The documents stay with the facility. Cardano holds their fingerprints (SHA-256), so anyone with a document can check it: hash the file and compare it with the fingerprint below.</p></section>

 <section class="sec"><h2>Where its cells came from</h2>${v.donors.map(donor).join('')}</section>

 ${v.checkedAt ? `<p class="muted" style="font-size:13px">These checks ran against Cardano on ${esc(v.checkedAt.slice(0, 10))}, when this page was published. To check again yourself, open any record below in a blockchain explorer.</p>` : ''}
 <section class="sec"><h2>Records on Cardano</h2><div class="card"><ul class="txs">${txs.map(([t, tx]) => `<li><b>${esc(t)}</b><br><span title="${esc(tx)}">${txLink(tx)}</span></li>`).join('')}</ul></div></section>`;
}

(async () => {
 const app = document.getElementById('app');
 const tx = location.pathname.split('/').pop();
 try {
  // The public passport site (passport-site.mjs) embeds the data; the review server serves it from /api/passport.
  let v = window.PASSPORT_DATA;
  if (!v) {
   const r = await fetch(`/api/passport?tx=${encodeURIComponent(tx)}`);
   v = await r.json();
   if (!r.ok) throw Error(v.error || `HTTP ${r.status}`);
  }
  app.innerHTML = render(v);
 } catch (e) {
  app.innerHTML = `${brand()}<div class="error"><b>This passport could not be read.</b><br>${esc(e.message)}</div>
   <p class="muted">Transaction: ${/^[0-9a-f]{64}$/.test(tx) ? txLink(tx, tx) : esc(tx)}</p>`;
 }
})();
</script>
</body>
</html>
