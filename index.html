<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery History Review</title>
<style>
:root{--bg:#fbfbfa;--panel:#fff;--soft:#f3f3f1;--ink:#0b0b0c;--muted:#6f6f78;--line:#e6e6e3;--accent:#0b0b0c;--accent-ink:#fff;
 --good:#16a34a;--warn:#b45309;--warn-bg:#fff7ed;--bad:#b91c1c;--bad-bg:#fef2f2;--chip:#f1f1ef;
 --signed:#15803d;--documented:#1d4ed8;--estimated:#7e22ce;
 --pa:#6366f1;--pb:#f97316;--pc:#14b8a6;--pd:#db2777;--pe:#ca8a04;--pf:#0ea5e9;--pg:#65a30d;--ph:#7c3aed;--pi:#0f766e;--pj:#b45309;--pk:#64748b;--blob1:#c7d2fe;--blob2:#fed7aa;--blob3:#99f6e4;
 --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#08080a;--panel:#111114;--soft:#18181c;--ink:#f5f5f4;--muted:#a1a1aa;--line:#26262b;--accent:#f5f5f4;--accent-ink:#08080a;
 --good:#4ade80;--warn:#fbbf24;--warn-bg:#2a1f0a;--bad:#f87171;--bad-bg:#2a1010;--chip:#1c1c21;
 --signed:#4ade80;--documented:#93c5fd;--estimated:#d8b4fe;
 --pa:#818cf8;--pb:#fb923c;--pc:#2dd4bf;--pd:#f472b6;--pe:#facc15;--pf:#38bdf8;--pg:#a3e635;--ph:#a78bfa;--pi:#2dd4bf;--pj:#fbbf24;--pk:#94a3b8;--blob1:#312e81;--blob2:#7c2d12;--blob3:#134e4a;
 --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
select,textarea,button{font:inherit;color:inherit}

/* Floating background blobs */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;width:42vmax;height:42vmax;border-radius:50%;filter:blur(80px);opacity:.45;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:var(--blob1);left:-12vmax;top:-14vmax}
.blobs i:nth-child(2){background:var(--blob2);right:-14vmax;top:20vh;animation-duration:26s;animation-delay:-6s}
.blobs i:nth-child(3){background:var(--blob3);left:20vw;bottom:-22vmax;animation-duration:30s;animation-delay:-12s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}

/* Top bar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;text-decoration:none}
.logo{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:15px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.brand:hover .logo{transform:rotate(-12deg) scale(1.15)}
.bar-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar-right a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px}
.bar-right a:hover{background:var(--soft);color:var(--ink)}
/* Draft menu and live status dot */
.drafts{position:relative}
#draft-btn{max-width:300px}
#draft-name{overflow:hidden;text-overflow:ellipsis;max-width:190px}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(340px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px;animation:enter .2s ease-out}
.menu[hidden]{display:none}
.menu .opt{display:flex;width:100%;gap:10px;align-items:center;justify-content:space-between;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;cursor:pointer;transition:background .15s,transform .15s}
.menu .opt:hover,.menu .opt:focus-visible{background:var(--soft);transform:translateX(3px)}
.menu .opt.on{background:var(--soft);font-weight:600}
.menu .hint{color:var(--muted);font-size:12px;padding:8px 12px 4px;border-top:1px solid var(--line);margin-top:6px}
.live{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.live.ok{background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
.live.part{background:var(--warn)}

/* Status page */
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.badge.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.svc{display:flex;flex-direction:column;gap:4px}
.svc .badge{align-self:flex-start}
.svc code,.kv code{background:var(--chip);border-radius:6px;padding:1px 6px;font-size:12px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:minmax(140px,220px) minmax(0,1fr);gap:10px 16px;font-size:14px}
.kv>div:nth-child(odd){color:var(--muted)}
@media (max-width:560px){.kv{grid-template-columns:1fr;gap:2px}.kv>div:nth-child(even){margin-bottom:8px}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr.mine td{background:color-mix(in srgb,var(--pa) 10%,transparent)}
.info{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:20px}
.nav{max-width:1200px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}

/* Pills */
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap;transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s}
.pill:hover{transform:translateY(-2px);background:var(--soft)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill .n{opacity:.6;font-weight:400}

main{max-width:1200px;margin:0 auto;padding:36px 16px 96px;min-height:70vh}
.page{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:clamp(30px,5.4vw,56px);line-height:1.04;letter-spacing:-.035em;margin:0 0 12px}
h2{font-size:22px;letter-spacing:-.02em;margin:0}
.lead{color:var(--muted);margin:0 0 28px;max-width:660px;font-size:17px}
.sec{margin-top:44px}
.sec-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:12px;margin:24px 0 10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:18px;transition:transform .2s}
.back:hover{color:var(--ink);transform:translateX(-4px)}

/* Overview */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:color-mix(in srgb,var(--panel) 70%,transparent);border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin-bottom:18px}
.eyebrow .live{width:7px;height:7px}
.gradient{background:linear-gradient(100deg,var(--pa),var(--pb) 50%,var(--pc));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shine 8s ease-in-out infinite alternate}
@keyframes shine{to{background-position:100% 0}}
.ov-hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:stretch}
@media (max-width:880px){.ov-hero{grid-template-columns:1fr}}
.ov-hero h1{font-size:clamp(32px,5vw,58px)}
.ov-hero .arrow{color:var(--muted);font-weight:400}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.cta .btn{text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.cta .btn span{transition:transform .2s}
.cta .btn:hover span{transform:translateX(4px)}
.glass{background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:24px}
.health{padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.health-top{display:flex;gap:18px;align-items:center}
.health-top svg{width:84px;flex:0 0 84px;height:auto;overflow:visible;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.health:hover .health-top svg{transform:rotate(-6deg) scale(1.06)}
.wave{animation:wave 4s linear infinite}
.wave.two{animation-duration:6.5s;opacity:.5}
@keyframes wave{to{transform:translateX(-200px)}}
.health-num b{display:block;font-size:44px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.health-num span{color:var(--muted);font-size:13px}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;align-items:end;height:120px;padding:0 2px;border-bottom:1px dashed var(--line);position:relative}
.bars a{display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-decoration:none}
.bars i{display:block;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--good),color-mix(in srgb,var(--good) 45%,transparent));transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) backwards;transition:filter .2s,transform .2s}
.bars a:hover i{filter:brightness(1.15);transform:scaleX(1.12)}
@keyframes grow{from{transform:scaleY(0)}}
.bar-labels{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:12px;margin-top:28px}
.kpi{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;text-decoration:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.kpi .ic{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--ink)}
.kpi .ic.warn{background:var(--warn-bg);color:var(--warn)}
.kpi .ic.bad{background:var(--bad-bg);color:var(--bad)}
.kpi .ic.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.kpi b{display:block;font-size:28px;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .l{display:block;font-size:14px;font-weight:600;margin-top:2px}
.kpi .s{display:block;font-size:12px;color:var(--muted)}
.ic svg{width:20px;height:20px}

.pipeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
@media (max-width:880px){.pipeline{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 0}}
.pstep{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 8px;text-decoration:none}
.pstep::before{content:"";position:absolute;top:22px;left:-50%;width:100%;height:2px;background:var(--line);z-index:-1}
.pstep:first-child::before{display:none}
.pstep.done::before{background:linear-gradient(90deg,var(--good),var(--good))}
@media (max-width:880px){.pstep::before{display:none}}
.pstep .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);color:var(--muted);position:relative;transition:transform .3s cubic-bezier(.34,1.56,.64,1),border-color .2s,color .2s}
.pstep.done .ic{border-color:var(--good);color:var(--good)}
.pstep.wait .ic{border-color:var(--warn);color:var(--warn);border-style:dashed}
.pstep.done .ic::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--good);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center}
.pstep:hover .ic{transform:translateY(-4px) scale(1.12)}
.pstep b{font-size:14px}
.pstep .st{font-size:12px;color:var(--muted)}
.pstep.wait .st{color:var(--warn)}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:880px){.two{grid-template-columns:1fr}}
.panel{padding:20px}
.panel h2{font-size:18px;margin-bottom:4px}
.panel .sub2{color:var(--muted);font-size:13px;margin:0 0 14px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-decoration:none}
.prow:first-of-type{border-top:0}
.prow .who{font-weight:600;display:flex;align-items:center;gap:8px;grid-row:span 2}
.prow .who .dot{width:12px;height:12px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%;transition:filter .2s}
.stack i.held{background:repeating-linear-gradient(45deg,var(--bad) 0 4px,color-mix(in srgb,var(--bad) 50%,transparent) 4px 8px)}
.prow:hover .stack i{filter:brightness(1.12)}
.prow .nums{font-size:12px;color:var(--muted)}
.att{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;text-decoration:none;transition:background .2s,transform .2s}
.att:hover{background:var(--soft);transform:translateX(4px)}
.att .ic{flex:0 0 32px;height:32px;border-radius:10px;display:grid;place-items:center}
.att .ic svg{width:17px;height:17px}
.att .ic.warn{background:var(--warn-bg);color:var(--warn)}
.att .ic.bad{background:var(--bad-bg);color:var(--bad)}
.att b{display:block;font-size:14px}
.att span{font-size:13px;color:var(--muted)}
.att .go{margin-left:auto;color:var(--muted);align-self:center;transition:transform .2s}
.att:hover .go{transform:translateX(3px);color:var(--ink)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:block;background:color-mix(in srgb,var(--panel) 80%,transparent);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-decoration:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.stat:hover{transform:translateY(-4px) scale(1.03);box-shadow:var(--shadow)}
.stat b{display:block;font-size:32px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}

/* Notes and red cards */
.note{display:block;padding:12px 14px;border-radius:14px;margin-bottom:8px;font-size:14px;text-decoration:none;transition:transform .2s}
.note:hover{transform:translateX(4px)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.held-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.held-card{background:var(--bad-bg);border-radius:18px;padding:14px 16px;min-width:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.held-card:hover{transform:translateY(-4px) rotate(.4deg);box-shadow:var(--shadow)}
.held-card .name{font-weight:700;color:var(--ink)}
.held-card .tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--bad);margin-top:2px}
.held-card ul{margin:8px 0 0;padding-left:18px;color:var(--bad);font-size:14px}
.ai{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0 0;font-size:14px;color:var(--ink);max-width:760px}
.ai .who{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.held-card li{margin:2px 0}
.cell-groups{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cell-group{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.cell-group .where{font-weight:600;margin-right:4px}
.c{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;font-variant-numeric:tabular-nums;transition:transform .15s}
.c:hover{transform:scale(1.25)}

/* Timelines */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0}
.card h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px}
.ident{font-size:12px;color:var(--muted);margin:-8px 0 12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.term .ident{margin:2px 0 6px}
.more{margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s}
.more:hover{transform:translateY(-2px);background:var(--panel)}
.flag-hint{background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.event{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:5px;border-radius:0 12px 12px 0;transition:background .2s}
.event:last-child{padding-bottom:0}
.event::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--muted);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.event:hover::before{transform:scale(1.6)}
.event:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.event.flagged{border-left-color:var(--warn)}
.event.flagged::before{border-color:var(--warn);background:var(--warn);box-shadow:0 0 0 0 var(--warn);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.event .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.type{font-weight:600;text-transform:capitalize}
.chip{background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;font-variant-numeric:tabular-nums}
.conf{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.conf.signed{color:var(--signed)}.conf.documented{color:var(--documented)}.conf.estimated{color:var(--estimated)}
.fields{font-size:13px;color:var(--muted)}
.quote{font-size:13px;margin-top:4px;background:var(--soft);border-radius:10px;padding:6px 9px;overflow-wrap:anywhere}
.quote q{font-style:italic}

/* ESS gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;perspective:1000px}
.ess{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden;transform-style:preserve-3d;transition:transform .2s ease-out,box-shadow .3s;will-change:transform}
.ess:hover{box-shadow:var(--shadow)}
.preview{position:relative;padding:22px;display:flex;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,color-mix(in srgb,var(--pa) 14%,var(--soft)),color-mix(in srgb,var(--pc) 14%,var(--soft)))}
.soh b{display:block;font-size:46px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.soh span{color:var(--muted);font-size:13px}
.ring{width:88px;height:88px;flex:0 0 88px;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.ess:hover .ring{transform:rotate(200deg) scale(1.08)}
.mix{display:flex;height:6px;border-radius:999px;overflow:hidden;margin-top:12px}
.mix i{display:block;height:100%}
.caption{padding:14px 18px 18px}
.caption .title{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.caption .title b{font-size:17px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.open{margin-top:12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;transition:gap .2s}
.ess:hover .open{gap:12px}

/* ESS detail */
.detail-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
@media (max-width:720px){.detail-top{grid-template-columns:1fr}}
.qr{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-size:12px;color:var(--muted);text-decoration:none;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.qr:hover{transform:scale(1.08) rotate(2deg)}
.qr svg{width:170px;height:170px;background:#fff;border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.qr.pending{width:170px;height:170px;justify-content:center;border:2px dashed var(--line);border-radius:16px;padding:12px;background:var(--panel)}
.bigstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:20px}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:22px}
.cell{aspect-ratio:1;border-radius:8px;position:relative;cursor:default;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,filter .25s;animation:pop .5s cubic-bezier(.34,1.56,.64,1) backwards}
.cell::after{content:"";position:absolute;left:28%;right:28%;top:-3px;height:4px;border-radius:2px 2px 0 0;background:inherit;filter:brightness(.8)}
.cell:hover{transform:scale(1.55);z-index:2;box-shadow:var(--shadow)}
.mosaic.focus .cell:not(.lit){filter:grayscale(1) opacity(.25)}
@keyframes pop{from{transform:scale(0)}}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;transition:transform .2s}
.legend button:hover,.legend button.on{transform:translateY(-2px);border-color:var(--ink)}
.sankey-wrap{overflow-x:auto;border-radius:22px;-webkit-overflow-scrolling:touch}
.sankey{width:100%;min-width:620px;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:22px}
.sankey .link{fill:none;stroke-opacity:.35;transition:stroke-opacity .2s}
.sankey.dim .link{stroke-opacity:.07}
.sankey.dim .link.on{stroke-opacity:.8}
.sankey .node rect{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.sankey .node:hover rect{transform:scale(1.15)}
.sankey text{font:12px system-ui,sans-serif;fill:var(--ink)}
.sankey .small{fill:var(--muted);font-size:11px}
.docs{font-size:13px;color:var(--muted);margin:6px 0 0;padding-left:18px;overflow-wrap:anywhere}

/* Tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:8px;opacity:0;transform:translate(-50%,-130%) scale(.9);transition:opacity .12s,transform .12s;white-space:nowrap}
#tip.show{opacity:1;transform:translate(-50%,-130%) scale(1)}

/* Help */
.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.term{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.term:hover{transform:translateY(-4px) scale(1.02);box-shadow:var(--shadow)}
.term b{display:block;font-size:16px;margin-bottom:4px}
.term code{background:var(--chip);border-radius:6px;padding:1px 6px;font-size:13px}
details.faq{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;transition:border-color .2s}
details.faq:hover{border-color:var(--ink)}
details.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";transition:transform .3s;font-size:20px;line-height:1}
details.faq[open] summary::after{transform:rotate(45deg)}
details.faq p{color:var(--muted);margin:8px 0 2px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12px;background:var(--panel)}

/* Cell families */
.fam-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:30px 0 12px}
.fam-head:first-child{margin-top:0}
.fam-head h2{font-size:18px;margin-right:4px}
.fam-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-10px 0 22px;font-size:13px;color:var(--muted)}
.matrix-wrap{overflow-x:auto;padding-bottom:4px}
.matrix{border-collapse:separate;border-spacing:6px;font-size:13px;max-width:100%}
.matrix th{font-weight:600;text-align:left;padding:6px 8px;color:var(--muted);font-size:12px;vertical-align:middle}
.matrix td{min-width:64px;height:48px;text-align:center;border-radius:12px;font-weight:700;font-size:18px;cursor:default;transition:transform .2s}
.matrix td:hover{transform:scale(1.12)}
.matrix td.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.matrix td.no{background:var(--bad-bg);color:var(--bad)}
.why{margin:14px 0 0;padding-left:18px;display:grid;gap:6px}
.why li{font-size:14px;color:var(--muted)}
.why b{color:var(--ink)}
.rule-note{background:color-mix(in srgb,var(--documented) 9%,transparent);border:1px solid color-mix(in srgb,var(--documented) 28%,transparent);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);margin:10px 0 0}
.rule-note .who{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--documented);margin-bottom:4px}

/* Sign */
.sign{display:flex;flex-direction:column;gap:12px;max-width:640px}
.sign label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
textarea{width:100%;min-height:88px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;align-self:flex-start;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.btn:hover:not(:disabled){transform:scale(1.06)}
.btn:disabled{opacity:.4;cursor:not-allowed}
#status{font-size:14px;white-space:pre-wrap;word-break:break-word}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Glass look (Apple-style frosted panels). Compare with the old solid panels: add ?look=classic to the address. */
:root{--glass:rgba(255,255,255,.55);--glass-soft:rgba(255,255,255,.38);--glass-edge:rgba(255,255,255,.75);

html:not(.classic) .blobs i{opacity:.7;filter:blur(90px)}
html:not(.classic) :is(.glass,.menu,.stat,.step,.card,.ess,.term,details.faq,.mosaic,.sankey,.held-card,.qr.pending){
 background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi),var(--glass-shadow);
 -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
html:not(.classic) :is(.stat,.step,.term,.held-card):hover{border-color:var(--glass-edge);background:color-mix(in srgb,var(--glass) 100%,rgba(255,255,255,.06));box-shadow:var(--glass-hi),0 18px 50px rgba(0,0,0,.18)}
html:not(.classic) :is(.kpi,.glass):hover{border-color:var(--glass-edge);box-shadow:var(--glass-hi),0 18px 50px rgba(0,0,0,.18)}
html:not(.classic) :is(.kpi .ic:not(.warn),.pstep .ic,.eyebrow,.more,.info){background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
html:not(.classic) :is(.ai,.quote){background:var(--glass-soft);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
html:not(.classic) :is(.pill:not(.on),.legend button,select,.c,kbd){background:var(--glass);border-color:var(--glass-edge);box-shadow:var(--glass-hi);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
html:not(.classic) :is(textarea,input:not([type=checkbox]):not([type=radio])){background:var(--glass-soft);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 2px rgba(0,0,0,.08);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:border-color .2s,box-shadow .2s}
html:not(.classic) :is(textarea,input):focus{outline:none;border-color:color-mix(in srgb,var(--pa) 60%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--pa) 22%,transparent)}
html:not(.classic) .bar{background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border-bottom-color:var(--glass-edge)}
html:not(.classic) .preview{background:linear-gradient(135deg,color-mix(in srgb,var(--pa) 18%,transparent),color-mix(in srgb,var(--pc) 18%,transparent))}

<script>
window.STATIC_SITE = true;
(() => {
 const real = window.fetch.bind(window);
 const refuse = () => Promise.resolve(new Response(JSON.stringify({error: 'This is the public read-only copy. Uploading and signing run on the second-life company’s own machine.'}), {status: 403, headers: {'content-type': 'application/json'}}));
 window.fetch = (url, options) => {
  const u = String(url);
  if (u === '/api/drafts') return real('api/drafts.json');
  if (u.startsWith('/api/draft?')) return real('api/draft/' + encodeURIComponent(new URLSearchParams(u.split('?')[1]).get('id')) + '.json');
  if (u === '/api/status') return real('api/status.json');
  if (u.startsWith('/api/')) return refuse();
  return real(url, options);
 };
})();
</script>
<style>.static-note{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;max-width:calc(100vw - 32px);font-size:13px;padding:8px 14px;border-radius:999px;
 background:rgba(20,20,24,.6);color:#f5f5f4;border:1px solid rgba(255,255,255,.15);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);text-align:center}</style>

<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="bar">
 <div class="bar-in">
  <a class="brand" href="#/overview"><span class="logo" aria-hidden="true">⚡</span>Battery history review</a>

   <div class="drafts">
    <button type="button" class="pill" id="draft-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="draft-menu"><span class="muted">Draft</span> <span id="draft-name">Loading…</span> <span aria-hidden="true">▾</span></button>

 </div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = t => String(t).replace(/_/g, ' ');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Readable names for codes, for display only. The draft data keeps the original IDs.
const cellRe = /\b([A-Z])-M(\d+)-C0*(\d+)\b/g, moduleRe = /\b([A-Z])-M(\d+)\b/g;
const placeName = id => String(id).replace(cellRe, 'Pack $1 · Module $2 · Cell $3').replace(moduleRe, 'Pack $1 · Module $2');
const shortName = id => String(id).replace(cellRe, '$1 · M$2 · C$3').replace(moduleRe, '$1 · M$2');
const ruleNames = {
 soh_after_replacement: 'high health reading soon after a module replacement',
 accident_without_inspection: 'accident with no later health check',
 dates_out_of_order: 'dates out of order',
 health_rising_without_repair: 'health rose without a repair',
};
const sentence = s => s.charAt(0).toUpperCase() + s.slice(1);
// The model's plain-language explanation of the grouping (draft.explanation). Code made the decision; this only explains it.
const aiNote = text => text ? `<p class="ai"><span class="who">AI explanation · check against the rules and events</span>${esc(text)}</p>` : '';
const explanation = () => current.draft.explanation || {ess: {}, modules: {}, cells: []};
// AI limits (input size, model quota, the job's time limit) can shorten or skip the explanation for large batches.
const aiLimitNote = () => current.draft.explanation
 ? '<p class="muted">AI restrictions may limit the explanation for large batch requests. The grouping itself is decided by code and is always complete.</p>'
 : '<div class="note warn">This draft has no AI explanation. AI restrictions (input size, model quota, and the job\'s time limit) may limit or skip the explanation for large batch requests. The grouping, held-back items, and their reasons are decided by code and are complete.</div>';
const reasonItems = reason => String(reason).split(/;(?!\s*an ESS needs)\s*/).filter(p => p && p !== 'not taken apart').map(p => sentence(placeName(p
 .replace(/^accident event (\S+)/, 'accident recorded (event $1)')
 .replace(/^open warning (\w+)/, (_, rule) => `open warning: ${ruleNames[rule] || label(rule)}`)
 .replace(/^quote not found at (\S+) page (\d+) line (\d+)/, 'the quoted text is not in $1 at page $2, line $3'))));
const packOf = id => String(id).split('-')[0];
// Packs beyond K get a colour from their letter, so any batch size renders.
const packColor = p => ({A: 'var(--pa)', B: 'var(--pb)', C: 'var(--pc)', D: 'var(--pd)', E: 'var(--pe)', F: 'var(--pf)', G: 'var(--pg)', H: 'var(--ph)', I: 'var(--pi)', J: 'var(--pj)', K: 'var(--pk)'})[p] || `hsl(${(String(p).charCodeAt(0) * 47) % 360} 60% 50%)`;
// Many items share one reason; group them. ["B-M3-C05", "B-M3-C08"] -> [["B-M3", ["5", "8"]]]
const groupBy = (list, key) => { const g = new Map(); for (const x of list) { const k = key(x); (g.get(k) || g.set(k, []).get(k)).push(x); } return [...g]; };
// Chemistry facts shown next to each cell family: nominal and full-charge cell voltage. Sources: docs/battery-info.md.
const CHEM = {
 NMC: {name: 'nickel manganese cobalt', v: '3.6–3.7 V', vmax: '4.2 V'},
 NCA: {name: 'nickel cobalt aluminium', v: '3.6 V', vmax: '4.2 V'},
 LFP: {name: 'lithium iron phosphate', v: '3.2 V', vmax: '3.65 V'},
 LMFP: {name: 'lithium manganese iron phosphate', v: '3.7–3.8 V', vmax: '4.2 V'},
 'LMO-NMC': {name: 'lithium manganese oxide / NMC blend', v: '3.7 V', vmax: '4.15–4.2 V'},
 'NA-ION': {name: 'sodium-ion', v: '3.0–3.1 V', vmax: '3.95 V'},
};
const chem = c => CHEM[String(c).toUpperCase()] || {name: String(c), v: 'unknown', vmax: 'unknown'};
// Cell families in the open draft: one per cell model + chemistry. Code never combines cells of two families.
function families() {
 const d = current.draft, fams = new Map();
 const add = (cell_model, chemistry, pack, b) => {
  const k = `${cell_model}|${chemistry}`;
  const f = fams.get(k) || fams.set(k, {key: k, cell_model, chemistry, ess: [], packs: new Set()}).get(k);
  if (b && !f.ess.includes(b)) f.ess.push(b);
  if (pack) f.packs.add(pack);
 };
 for (const b of d.new_batteries || []) for (const p of b.donor_packs || []) add(b.cell_model, b.chemistry, p, b);
 // A pack that formed no ESS: its production event may still name the chemistry and cell model.
 for (const p of d.packs) if (![...fams.values()].some(f => f.packs.has(p))) {
  const e = d.events.find(x => x.pack_id === p && x.type === 'production' && x.fields?.chemistry);
  if (e) add(e.fields.cell_model || 'cell model not documented', e.fields.chemistry, p, null);
 }
 const first = f => f.ess.length ? Math.min(...f.ess.map(b => Number(String(b.battery_id).replace(/\D/g, '')) || 0)) : Infinity;
 return [...fams.values()].sort((a, b) => first(a) - first(b) || a.key.localeCompare(b.key));
}
// What identifies a pack in its documents: model and serial number from the label, VIN from the registration.
function packIdentity(p) {
 const d = current.draft, f = t => d.events.find(e => e.pack_id === p && e.type === t)?.fields || {};
 const prod = f('production'), reg = f('first_registration');
 return {maker: prod.manufacturer, model: prod.pack_model, serial: prod.serial_number, vin: reg.vin};
}
const identityParts = p => { const i = packIdentity(p); return [i.model, i.serial ? `S/N ${i.serial}` : null, i.vin ? `VIN ${i.vin}` : null].filter(Boolean); };
const identityLine = p => { const parts = identityParts(p); return parts.length ? `<div class="ident">${parts.map(esc).join(' · ')}</div>` : ''; };
const familyOfPack = p => families().find(f => f.packs.has(p));
const famLabel = f => `${f.cell_model} · ${f.chemistry}`;
// Why two families never share an ESS.
function incompatible(a, b) {
 if (a.chemistry !== b.chemistry) return `different chemistry: ${a.chemistry} cells sit at ${chem(a.chemistry).v} and are charged to ${chem(a.chemistry).vmax}, ${b.chemistry} cells at ${chem(b.chemistry).v} and ${chem(b.chemistry).vmax}. In one series string the battery management system would over-charge one type or under-use the other.`;
 return `same chemistry (${a.chemistry}), different cell model (${a.cell_model} vs ${b.cell_model}): different capacity, internal resistance, format and ageing curve. The weakest cell would set the whole string's capacity and the others would age unevenly.`;
}
const cellsByModule = ids => groupBy(ids, id => id.replace(/-C\d+$/, '')).map(([m, cs]) => [m, cs.map(id => id.replace(/^.*-C0*/, ''))]);

const app = document.getElementById('app'), nav = document.getElementById('nav'), tip = document.getElementById('tip');
const draftBtn = document.getElementById('draft-btn'), draftMenu = document.getElementById('draft-menu'), draftName = document.getElementById('draft-name');
let current = null, drafts = [], statusData = null, statusError = false;
// The public read-only copy (passport-site.mjs) cannot sign: the company signs on its own machine.
const PUBLIC = window.STATIC_SITE === true;

const routes = [
 ['new', 'New job', '0'],
 ['overview', 'Overview', '1'],
 ['histories', 'Donor histories', '2'],
 ['ess', 'ESS passports', '3'],
 ['held', 'Held back', '4'],
 ['sign', 'Sign', '5'],
 ['status', 'Status', '6'],
 ['help', 'Help', '?'],
];

async function load() {
 try { drafts = await (await fetch('/api/drafts')).json(); }
 catch { app.innerHTML = '<h1>Server not reachable</h1><p class="lead">Start it with <code>npm run review</code> and open http://127.0.0.1:21952.</p>'; draftName.textContent = 'none'; return; }
 renderDraftMenu();
 if (!drafts.length) { app.innerHTML = '<p class="muted">No drafts yet.</p>'; draftName.textContent = 'none'; return; }
 await show((drafts.filter(d => d.paid).at(-1) || drafts[0]).id);
}
async function show(id) {
 current = await (await fetch('/api/draft?id=' + encodeURIComponent(id))).json();
 const d = drafts.find(x => x.id === id);
 draftName.textContent = d ? (d.paid ? d.label : d.id === 'demo' ? 'Demo · 3 NMC packs' : d.id === 'demo-mixed' ? 'Demo · 11 packs, 8 families' : d.label.replace(/\s*\(.*\)$/, '')) : id;
 renderDraftMenu();
 route();
}

// Draft picker: a menu instead of a native select, so it opens and explains itself even with one draft.
function renderDraftMenu() {
 draftMenu.innerHTML = drafts.map(d => `<button type="button" class="opt ${current?.id === d.id ? 'on' : ''}" role="option" aria-selected="${current?.id === d.id}" data-id="${esc(d.id)}">
   <span>${esc(d.label)}</span>${d.paid ? '<span class="badge ok">paid</span>' : '<span class="badge warn">demo</span>'}</button>`).join('')
  + `<div class="hint">${drafts.some(d => d.paid) ? 'Paid drafts come from paid Masumi jobs run on this machine.' : 'Only the demo draft is on this machine. Paid drafts appear here on the machine that ran the paid job (Member 4\'s).'}</div>`;
 for (const b of draftMenu.querySelectorAll('.opt')) b.onclick = () => { closeDraftMenu(); if (b.dataset.id !== current?.id) show(b.dataset.id); };
}
const openDraftMenu = () => { draftMenu.hidden = false; draftBtn.setAttribute('aria-expanded', 'true'); draftMenu.querySelector('.opt.on, .opt')?.focus(); };
const closeDraftMenu = () => { draftMenu.hidden = true; draftBtn.setAttribute('aria-expanded', 'false'); };
draftBtn.onclick = e => { e.stopPropagation(); draftMenu.hidden ? openDraftMenu() : closeDraftMenu(); };
document.addEventListener('click', e => { if (!e.target.closest('.drafts')) closeDraftMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !draftMenu.hidden) { closeDraftMenu(); draftBtn.focus(); } });

// Status: fetched every 10 s for the dot in the top bar, and shown in full on #/status.
async function refreshStatus() {
 try { statusData = await (await fetch('/api/status')).json(); statusError = false; }
 catch { statusError = true; }
 const live = document.getElementById('live'), n = document.getElementById('live-n');
 const up = statusData ? statusData.services.filter(s => s.up).length : 0, all = statusData ? statusData.services.length : 0;
 live.className = 'live ' + (statusError || !all ? '' : up === all ? 'ok' : up ? 'part' : '');
 n.textContent = statusError ? '!' : all ? `${up}/${all}` : '';
 if (currentRoute() === 'status' && current) route({keepScroll: true, quiet: true});
}
setInterval(refreshStatus, 10000);

window.addEventListener('hashchange', () => route());
const currentRoute = () => location.hash.replace(/^#\/?/, '').split('/')[0] || 'overview';
function route({keepScroll = false, quiet = false} = {}) {
 if (!current) return;
 const [rawName, arg] = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
 const name = rawName || 'overview'; // a bare URL with no hash opens the overview
 const d = current.draft;
 const counts = {histories: d.packs.length, ess: (d.new_batteries || []).length, held: (d.held_back || []).length + d.rejected.length};
 nav.innerHTML = routes.map(([id, title]) => `<a class="pill ${id === name ? 'on' : ''}" href="#/${id}">${esc(title)}${counts[id] != null ? `<span class="n">${esc(counts[id])}</span>` : ''}</a>`).join('');
 const pages = {new: newJob, overview, histories, ess: arg ? essDetail.bind(null, arg) : essGallery, held, sign: signPage, status: statusPage, help};
 document.getElementById('status-link').classList.toggle('on', name === 'status');
 // A status refresh redraws in place: no entry animation, no jump to the top.
 app.innerHTML = `<div class="${quiet ? '' : 'page'}">${(pages[name] || notFound)()}</div>`;
 if (!keepScroll) window.scrollTo({top: 0, behavior: 'instant'});
 if (!quiet) wire();
}

// Keyboard: 1-5 and ? jump between pages.
document.addEventListener('keydown', e => {
 if (e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
 const r = routes.find(([, , key]) => key === e.key);
 if (r) location.hash = '#/' + r[0];
});

// ---------- Pages ----------

// Line icons (24px grid, stroke = currentColor), so the overview does not depend on emoji fonts.
const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${{
 doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
 check: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M8 11l2 2 4-4"/>',
 alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
 layers: '<path d="m12 2 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/>',
 battery: '<rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M6 10v4M10 10v4M14 10v4"/>',
 sign: '<path d="M3 21h18M15.5 4.5l4 4L9 19H5v-4z"/>',
 x: '<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>',
 ban: '<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
 recycle: '<path d="M7 19H4.8a1.8 1.8 0 0 1-1.6-2.7L7 10M10.6 5.3 12 3l3.8 6.6M17 19h2.2a1.8 1.8 0 0 0 1.6-2.7L19 13"/><path d="m14 16-3 3 3 3M8.3 6.9 7 10l-3-1M16.7 13.3 19 13l1 3"/>',
}[name] || ''}</svg>`;

function overview() {
 const d = current.draft, ess = d.new_batteries || [], held = d.held_back || [];
 const heldMods = held.filter(h => h.level === 'module'), heldCells = held.filter(h => h.level === 'cell');
 const used = ess.reduce((n, b) => n + b.cells.length, 0), tested = used + heldCells.length;
 const reuse = tested ? Math.round(used / tested * 100) : 0;
 const sohs = ess.map(b => Number(b.health?.soh_pct)).filter(Number.isFinite);
 const avg = sohs.length ? sohs.reduce((a, b) => a + b, 0) / sohs.length : 0;
 const modulesTested = (d.test_files?.module_tests || []).length;
 const signed = Object.keys(current.passports || {}).length > 0;
 const documented = d.events.filter(e => e.confidence !== 'estimated').length;

 // Battery drawing: liquid level follows the average health.
 const level = 220 - Math.max(0, Math.min(100, avg)) * 1.8;
 const wave = y => `M0 ${y} q25 -9 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V230 H0 Z`;
 // Bars use an 80-100% axis so small differences stay visible; the axis is labelled.
 const lo = 80, bar = v => Math.max(4, (v - lo) / (100 - lo) * 100);

 const kpi = (href, ic, cls, n, l, s, unit = '') => `<a class="kpi glass" href="${href}"><span class="ic ${cls}">${icon(ic)}</span><span><b data-count="${esc(n)}" data-unit="${esc(unit)}">${esc(n)}${esc(unit)}</b><span class="l">${esc(l)}</span><span class="s">${esc(s)}</span></span></a>`;

 const steps = [
  ['doc', 'Documents', `${d.documents.length} files hashed`, 'done', 'Invoices, registrations and reports are uploaded and fingerprinted (SHA-256).', 'histories'],
  ['check', 'Verify', `${d.events.length} kept, ${d.rejected.length} rejected`, 'done', 'Code checks every quote word for word at its page and line.', 'held'],
  ['alert', 'Warnings', `${d.warnings.length} found`, 'done', 'Rules look for contradictions between events.', 'histories'],
  ['layers', 'Screen modules', `${heldMods.length} held back`, 'done', 'Modules with an accident or open warning are not taken apart.', 'held'],
  ['battery', 'Group cells', `${ess.length} ESS units`, 'done', 'Matching cells are combined into new ESS units.', 'ess'],
  ['sign', 'Sign & publish', signed ? 'Published on Cardano' : current.paid ? (PUBLIC ? 'On the company’s machine' : 'Ready to sign') : 'Demo: not signable', signed ? 'done' : 'wait', 'A person signs; event logs and QR passports go on Cardano.', 'sign'],
 ];

 const packRows = d.packs.map(p => {
  const u = ess.reduce((n, b) => n + b.cells.filter(c => (c.donor_pack || packOf(c.module_id)) === p).length, 0);
  const hc = heldCells.filter(h => packOf(h.id) === p).length;
  const hm = heldMods.filter(h => packOf(h.id) === p).length;
  const ev = d.events.filter(e => e.pack_id === p).length;
  const total = u + hc || 1;
  return `<a class="prow" href="#/histories"><span class="who" ${identityParts(p).length ? `data-tip="${esc(identityParts(p).join(' · '))}"` : ''}><span class="dot" style="background:${packColor(p)}"></span>Pack ${esc(p)}${familyOfPack(p) ? `<span class="chip" data-tip="cell family">${esc(famLabel(familyOfPack(p)))}</span>` : ''}</span>
   <span class="stack" data-tip="${esc(u)} cells used · ${esc(hc)} cells not used"><i style="width:${(u / total * 100).toFixed(1)}%;background:${packColor(p)}"></i><i class="held" style="width:${(hc / total * 100).toFixed(1)}%"></i></span>
   <span class="nums">${esc(u)} cells used · ${esc(hc)} not used · ${esc(hm)} module${hm === 1 ? '' : 's'} held back · ${esc(ev)} events</span></a>`;
 }).join('');

 const attention = [
  ...d.warnings.map(w => ['warn', 'alert', 'Warning', placeName(w.message), '#/histories']),
  ...d.rejected.map(x => ['bad', 'x', `Claim ${x.event_id} rejected`, reasonItems(x.reason).join('. '), '#/held']),
  ...heldMods.map(h => ['bad', 'ban', `${placeName(h.id)} not taken apart`, reasonItems(h.reason).join('. '), '#/held']),
 ];

 return `
 <section class="ov-hero">
  <div>
   <span class="eyebrow"><span class="live ${signed ? 'ok' : current.paid ? 'part' : ''}"></span>${signed ? 'Signed draft' : current.paid ? (PUBLIC ? 'Paid draft · read-only copy' : 'Paid draft · ready to sign') : 'Demo draft · invented data'}</span>
   <h1>${esc(d.packs.length)} donor packs <span class="arrow">→</span><br><span class="gradient">${esc(ess.length)} new ESS units</span></h1>
   <p class="lead">Every fact is quoted from a source document and checked by code. The AI is a clerk, not a witness; deterministic rules decide which cells go together, and a person signs the result.</p>
   <div class="fam-line">${families().length} cell famil${families().length === 1 ? 'y' : 'ies'} in this batch, never combined:${families().map(f => `<a class="chip" href="#/ess" data-tip="${esc(chem(f.chemistry).name)} · ${esc(chem(f.chemistry).v)} nominal">${esc(famLabel(f))}</a>`).join('')}</div>
   <div class="cta"><a class="btn" href="#/ess">View ESS passports <span aria-hidden="true">→</span></a><a class="pill" href="#/histories">Donor histories</a></div>
  </div>
  <div class="glass health">
   <div class="health-top">
    <svg viewBox="0 0 200 250" role="img" aria-label="Average second-life health ${esc(avg.toFixed(1))}%">
     <defs><clipPath id="body"><rect x="20" y="30" width="160" height="200" rx="30"/></clipPath>
      <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--pa)"/><stop offset=".5" stop-color="var(--pb)"/><stop offset="1" stop-color="var(--pc)"/></linearGradient></defs>
     <rect x="72" y="10" width="56" height="26" rx="9" fill="var(--ink)"/>
     <rect x="20" y="30" width="160" height="200" rx="30" fill="var(--soft)"/>
     <g clip-path="url(#body)"><path class="wave two" d="${wave(level + 4)}" fill="url(#liquid)"/><path class="wave" d="${wave(level)}" fill="url(#liquid)"/></g>
     <rect x="20" y="30" width="160" height="200" rx="30" fill="none" stroke="var(--ink)" stroke-width="10"/>
    </svg>
    <div class="health-num"><b>${esc(avg.toFixed(1))}%</b><span>average second-life health${sohs.length ? ` · range ${esc(Math.min(...sohs))}–${esc(Math.max(...sohs))}%` : ''}</span></div>
   </div>
   ${ess.length ? `<div>
    <div class="axis"><span>Health per ESS${ess.length > 8 ? ' (unit number)' : ''}</span><span>axis 80–100%</span></div>
    <div class="bars">${ess.map((b, i) => `<a href="#/ess/${encodeURIComponent(b.battery_id)}" data-tip="${esc(b.battery_id)}: ${esc(b.health?.soh_pct)}% · ${esc(b.cells.length)} cells"><i style="height:${bar(Number(b.health?.soh_pct) || lo).toFixed(1)}%;animation-delay:${reduceMotion ? 0 : i * 90}ms"></i></a>`).join('')}</div>
    <div class="bar-labels">${ess.map(b => `<span>${esc(ess.length > 8 ? String(b.battery_id).replace(/^ESS-/, '') : b.battery_id)}</span>`).join('')}</div>
   </div>` : ''}
  </div>
 </section>

 <section class="kpis">
  ${kpi('#/histories', 'doc', '', d.events.length, 'verified events', `${documented} quoted from documents`)}
  ${kpi('#/ess', 'recycle', 'good', reuse, 'cells reused', `${used} of ${tested} tested cells, in ${ess.length} ESS units`, '%')}
  ${kpi('#/histories', 'alert', 'warn', d.warnings.length, 'warnings', 'contradictions between events')}
  ${kpi('#/held', 'x', 'bad', d.rejected.length, 'rejected claims', 'quote not found in document')}
  ${kpi('#/held', 'ban', 'bad', heldMods.length, 'modules held back', modulesTested ? `${modulesTested - heldMods.length} of ${modulesTested} taken apart` : 'not taken apart')}
 </section>

 <section class="sec"><div class="sec-head"><div><h2>Pipeline</h2><p>Hover a step for details, click to open its page.</p></div></div>
  <div class="pipeline">${steps.map(([ic, t, st, state, tipText, to]) => `<a class="pstep ${state}" href="#/${to}" data-tip="${esc(tipText)}"><span class="ic">${icon(ic)}</span><b>${esc(t)}</b><span class="st">${esc(st)}</span></a>`).join('')}</div>
 </section>

 <section class="sec two">
  <div class="glass panel"><h2>Donor packs</h2><p class="sub2">Where the reused cells came from. Striped: tested but not used.</p>${packRows}</div>
  <div class="glass panel"><h2>Needs attention</h2><p class="sub2">${esc(attention.length)} item${attention.length === 1 ? '' : 's'} to review before signing.</p>
   ${attention.map(([cls, ic, title, text, href]) => `<a class="att" href="${href}"><span class="ic ${cls}">${icon(ic)}</span><span><b>${esc(title)}</b><span>${esc(text)}</span></span><span class="go" aria-hidden="true">→</span></a>`).join('') || '<p class="muted">Nothing to review.</p>'}
  </div>
 </section>`;
}

function histories() {
 const d = current.draft, flagged = new Set(d.warnings.flatMap(w => w.events));
 const filter = sessionFilter();
 const shown = filter === 'all' ? d.packs : d.packs.filter(p => p === filter);
 // Events name modules as module_ids/cell_ids (team format) or module_id (older battery code).
 const parts = e => [...(e.cell_ids || []), ...(e.cell_ids?.length ? [] : e.module_ids || (e.module_id ? [e.module_id] : []))];
 const event = e => `<div class="event ${flagged.has(e.event_id) ? 'flagged' : ''}">
  <div class="top"><span class="date">${esc(e.date)}</span><span class="type">${esc(label(e.type))}</span>
  <span class="chip">${esc(parts(e).map(shortName).join(', ') || 'whole pack')}</span>
  <span class="conf ${esc(e.confidence)}" data-tip="${esc(confHelp[e.confidence] || '')}">${esc(e.confidence)}</span></div>
  <div class="fields">${Object.entries(e.fields || {}).map(([k, v]) => `${esc(label(k))}: ${esc(v)}`).join(' · ')}</div>
  ${e.source ? `<div class="quote"><q>${esc(e.source.quote)}</q> <span class="muted">— ${esc(e.source.doc_id)}, p. ${esc(e.source.page)}, line ${esc(e.source.line)}</span></div>`
   : `<div class="quote muted">Derived from ${esc((e.basis || []).join(', '))}</div>`}
 </div>`;
 // Each card opens with the first event only; the rest sit behind a "Show more" button.
 const pack = p => {
  const all = d.events.filter(e => e.pack_id === p).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const open = openPacks.has(p), shown = open ? all : all.slice(0, 1), hidden = all.length - shown.length;
  const hiddenFlagged = all.slice(1).filter(e => flagged.has(e.event_id)).length;
  return `<div class="card"><h3><span class="dot" style="background:${packColor(p)}"></span>Pack ${esc(p)}<span class="meta" style="margin-left:auto;font-weight:400">${esc(all.length)} event${all.length === 1 ? '' : 's'}</span></h3>
   ${identityLine(p)}
   ${shown.map(event).join('') || '<p class="muted">No events.</p>'}
   ${all.length > 1 ? `<button type="button" class="more" data-expand="${esc(p)}" aria-expanded="${open}">${open ? 'Show less ▴' : `Show ${esc(hidden)} more event${hidden === 1 ? '' : 's'} ▾`}${!open && hiddenFlagged ? `<span class="flag-hint">${esc(hiddenFlagged)} in a warning</span>` : ''}</button>` : ''}
  </div>`;
 };
 return `
 <h1>Donor histories</h1>
 <p class="lead">One timeline per old battery pack. Pulsing dots are part of a warning. Hover a confidence label to see what it means.</p>
 ${d.warnings.length ? d.warnings.map(w => `<div class="note warn">${esc(placeName(w.message))}</div>`).join('') : ''}
 <div class="sec-head" style="margin-top:24px"><span></span><div class="tags">${['all', ...d.packs].map(p => `<button type="button" class="pill ${filter === p ? 'on' : ''}" data-pack="${esc(p)}">${p === 'all' ? 'All packs' : `<span class="dot" style="background:${packColor(p)}"></span>Pack ` + esc(p)}</button>`).join('')}</div></div>
 <div class="packs">${shown.map(pack).join('')}</div>`;
}
const confHelp = {signed: 'Signed by the source itself', documented: 'Quoted from a document whose hash is anchored', estimated: 'Concluded from other events; never used for grouping'};
let packFilter = 'all';
const openPacks = new Set(); // packs whose full timeline is open on the histories page
const sessionFilter = () => packFilter;

const sohRing = (pct, size = 88) => {
 const r = 36, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, Number(pct) || 0));
 return `<svg class="ring" viewBox="0 0 88 88" width="${size}" height="${size}" aria-hidden="true">
  <circle cx="44" cy="44" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
  <circle cx="44" cy="44" r="${r}" fill="none" stroke="var(--good)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 44 44)"/>
 </svg>`;
};
const packMix = b => { const g = groupBy(b.cells, c => c.donor_pack || packOf(c.module_id)); return `<div class="mix" aria-hidden="true">${g.map(([p, cs]) => `<i style="width:${(cs.length / b.cells.length * 100).toFixed(2)}%;background:${packColor(p)}"></i>`).join('')}</div>`; };

function essGallery() {
 const ess = current.draft.new_batteries || [];
 const card = b => {
  const h = b.health || {}, f = b.second_life_facility || {};
  return `<a class="ess tilt" href="#/ess/${encodeURIComponent(b.battery_id)}">
   <div class="preview"><div class="soh"><b>${esc(h.soh_pct)}%</b><span>second-life health</span></div>${sohRing(h.soh_pct)}</div>
   <div class="caption">
    <div class="title"><b>${esc(b.battery_id)}</b><span class="meta">${esc(h.cell_count)} cells</span></div>
    <div class="meta">${esc(f.name)} · ${esc(f.site)}</div>
    ${packMix(b)}
    <div class="tags"><span class="chip">${esc(h.usable_capacity_ah)} / ${esc(h.nominal_capacity_ah)} Ah</span><span class="chip">${esc(b.chemistry)}</span><span class="chip">Packs ${esc((b.donor_packs || []).join(', '))}</span></div>
    <span class="open">Open passport <span aria-hidden="true">→</span></span>
   </div></a>`;
 };
 const F = families(), withEss = F.filter(f => f.ess.length);
 const mixedDemo = drafts.find(x => x.id === 'demo-mixed');
 const pairs = [];
 for (let i = 0; i < F.length; i++) for (let j = i + 1; j < F.length; j++) pairs.push([F[i], F[j]]);
 const matrix = F.length < 2 ? '' : `<div class="matrix-wrap"><table class="matrix" aria-label="Which cell families may share an ESS"><tr><th></th>${F.map(f => `<th>${esc(famLabel(f))}</th>`).join('')}</tr>
   ${F.map(a => `<tr><th>${esc(famLabel(a))}</th>${F.map(b => a === b
    ? `<td class="ok" data-tip="Same cell model and chemistry: these cells may share an ESS">✓</td>`
    : `<td class="no" data-tip="${esc(incompatible(a, b))}">✗</td>`).join('')}</tr>`).join('')}</table></div>
   ${pairs.length > 3 ? `<details class="faq" style="margin-top:14px"><summary>Why each pair is kept apart (${pairs.length} pairs)</summary>` : ''}<ul class="why">${pairs.map(([a, b]) => `<li><b>${esc(famLabel(a))}</b> and <b>${esc(famLabel(b))}</b>: ${esc(incompatible(a, b))}</li>`).join('')}</ul>${pairs.length > 3 ? '</details>' : ''}`;
 return `
 <h1>ESS passports</h1>
 <p class="lead">Each new energy storage unit gets a passport. Its QR code shows the unit's second-life health, the facility that made it, and links back to every donor pack. The coloured bar shows which packs its cells came from.</p>
 ${aiLimitNote()}
 ${withEss.map(f => `<div class="fam-head"><h2>${esc(f.cell_model)}</h2><span class="chip">${esc(f.chemistry)} · ${esc(chem(f.chemistry).name)}</span><span class="chip">${esc(chem(f.chemistry).v)} nominal</span><span class="chip">${esc(f.ess.length)} ESS unit${f.ess.length === 1 ? '' : 's'}</span><span class="chip">Packs ${esc([...f.packs].sort().join(', '))}</span></div>
  <div class="gallery">${f.ess.map(card).join('')}</div>`).join('') || '<p class="muted">No ESS proposed.</p>'}
 <section class="sec"><div class="sec-head"><div><h2>Which cells may share an ESS</h2><p>Code groups by cell family: the same cell model <em>and</em> the same chemistry. Nothing else is ever combined.</p></div></div>
  ${matrix || `<p class="muted">All cells in this batch belong to one family (${esc(F.map(famLabel).join(', ') || 'unknown')}). Cells of another chemistry or another cell model would form their own units or stay held back.${mixedDemo ? ' ' : ''}</p>${mixedDemo ? `<button type="button" class="pill" data-open-draft="demo-mixed">Open the 11-pack demo with 8 cell families →</button>` : ''}`}
 </section>`;
}

function essDetail(id) {
 const d = current.draft, b = (d.new_batteries || []).find(x => x.battery_id === id);
 if (!b) return notFound();
 const h = b.health || {}, f = b.second_life_facility || {}, qr = (current.passports || {})[b.battery_id];
 const mods = groupBy(b.cells, c => c.module_id).sort((x, y) => x[0].localeCompare(y[0], 'en', {numeric: true}));
 const packs = groupBy(b.cells, c => c.donor_pack || packOf(c.module_id)).sort((x, y) => x[0].localeCompare(y[0]));

 // Flow diagram: donor packs -> modules -> this ESS. Line width = number of cells.
 const rowH = 26, top = 30, H = Math.max(top * 2 + mods.length * rowH, 260), W = 760;
 const xP = 110, xM = 400, xE = 650;
 const modY = new Map(mods.map(([m], i) => [m, top + i * rowH + rowH / 2]));
 const packY = new Map(packs.map(([p]) => { const ys = mods.filter(([m]) => packOf(m) === p).map(([m]) => modY.get(m)); return [p, (Math.min(...ys) + Math.max(...ys)) / 2]; }));
 const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`; };
 const yE = H / 2;
 const sankey = `<svg class="sankey" id="sankey" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cells flow from donor packs through modules into ${esc(b.battery_id)}">
  ${mods.map(([m, cs]) => { const p = packOf(m), w = 1.5 + cs.length * 1.6; return `
   <path class="link" data-k="${esc(m)} ${esc(p)}" d="${curve(xP + 14, packY.get(p), xM - 6, modY.get(m))}" stroke="${packColor(p)}" stroke-width="${w}"/>
   <path class="link" data-k="${esc(m)} ${esc(p)}" d="${curve(xM + 6, modY.get(m), xE - 14, yE)}" stroke="${packColor(p)}" stroke-width="${w}"/>`; }).join('')}
  ${packs.map(([p, cs]) => `<g class="node" data-k="${esc(p)}" data-tip="Pack ${esc(p)}: ${esc(cs.length)} cells"><rect x="${xP - 14}" y="${packY.get(p) - 22}" width="28" height="44" rx="8" fill="${packColor(p)}"/><text x="${xP - 24}" y="${packY.get(p) + 4}" text-anchor="end" font-weight="700">Pack ${esc(p)}</text></g>`).join('')}
  ${mods.map(([m, cs]) => `<g class="node" data-k="${esc(m)}" data-tip="${esc(placeName(m))}: ${esc(cs.length)} cells used"><rect x="${xM - 6}" y="${modY.get(m) - 8}" width="12" height="16" rx="3" fill="${packColor(packOf(m))}"/><text x="${xM + 14}" y="${modY.get(m) + 4}" class="small">${esc(shortName(m))} · ${esc(cs.length)}</text></g>`).join('')}
  <g class="node" data-k="ess" data-tip="${esc(b.battery_id)}: ${esc(b.cells.length)} cells"><rect x="${xE - 14}" y="${yE - 40}" width="28" height="80" rx="10" fill="var(--ink)"/><text x="${xE + 24}" y="${yE + 4}" font-weight="700">${esc(b.battery_id)}</text></g>
 </svg>`;

 return `
 <a class="back" href="#/ess">← All ESS passports</a>
 <div class="detail-top">
  <div>
   <h1>${esc(b.battery_id)} <span class="muted" style="font-weight:500">passport</span></h1>

// Left-over cells of one family next to finished units of another: say why they were not added there.
function familyNote(hs) {
 const fam = familyOfPack(packOf(hs[0]?.id || ''));
 // Units of the same chemistry but another cell model are the ones a reader would expect these cells to join.
 const others = fam ? families().filter(f => f.key !== fam.key && f.chemistry === fam.chemistry && f.ess.length) : [];
 if (!others.length || !/left over/.test(hs[0].reason)) return '';
 return `<p class="rule-note"><span class="who">Rule: cell families are never combined</span>These are ${esc(famLabel(fam))} cells. This batch also built ${esc(others.map(f => `${f.ess.length} ESS unit${f.ess.length === 1 ? '' : 's'} of ${famLabel(f)}`).join(' and '))}, but these cells were not added there: ${esc(incompatible(fam, others[0]))}</p>`;
}

function held() {
 const d = current.draft, list = d.held_back || [];
 const mods = list.filter(h => h.level === 'module'), cells = list.filter(h => h.level === 'cell');
 const items = r => `<ul>${reasonItems(r).map(t => `<li>${esc(t)}</li>`).join('')}</ul>`;
 return `
 <h1>Held back</h1>
 <p class="lead">What the code refused to use, and why. Nothing here is deleted: every decision is recorded with its reason so a buyer can check it later.</p>
 ${aiLimitNote()}
 ${d.rejected.length ? `<p class="sub">Claims rejected by verification</p><div class="held-grid">${d.rejected.map(x => `<div class="held-card"><div class="name">Claim ${esc(x.event_id)}${/^[A-Z]-/.test(x.event_id || '') ? ` <span class="muted">· Pack ${esc(x.event_id[0])}</span>` : ''}</div><span class="tag">Rejected</span>${items(x.reason)}</div>`).join('')}</div>` : ''}
 ${mods.length ? `<p class="sub">Modules not taken apart</p><div class="held-grid">${mods.map(h => `<div class="held-card"><div class="name">${esc(placeName(h.id))}</div><span class="tag">Not taken apart</span>${items(h.reason)}${aiNote(explanation().modules?.[h.id])}</div>`).join('')}</div>` : ''}
 ${cells.length ? `<p class="sub">Cells not used</p><div class="held-grid">${groupBy(cells, h => h.reason).map(([reason, hs]) => `<div class="held-card">
   <div class="name">${esc(hs.length)} cell${hs.length === 1 ? '' : 's'}</div><span class="tag">Not used</span>${items(reason)}
   ${familyNote(hs)}
   ${[...new Set((explanation().cells || []).filter(g => g.cell_ids.some(id => hs.some(h => h.id === id))).map(g => g.text))].map(aiNote).join('')}
   <div class="cell-groups">${cellsByModule(hs.map(h => h.id)).map(([m, ns]) => `<div class="cell-group"><span class="where">${esc(placeName(m))}</span>${ns.map(n => `<span class="c">Cell ${esc(n)}</span>`).join('')}</div>`).join('')}</div>
  </div>`).join('')}</div>` : ''}
 ${!list.length && !d.rejected.length ? '<p class="muted">Nothing was held back.</p>' : ''}`;
}

async function upload(body, label) {
 const status = document.getElementById('up-status');
 status.textContent = `Uploading ${label}…`;
 const res = await fetch('/api/upload', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
 const out = await res.json();
 if (!res.ok) { status.textContent = `Not uploaded: ${out.error}`; return; }
 status.textContent = `Uploaded ${label}.`;
 document.getElementById('up-summary').textContent = `${out.packs.length} donor packs (${out.packs.join(', ')}): ${out.documents} documents, ${out.moduleTests} module tests, ${out.cellTests} cell test batches.`;
 document.getElementById('up-input').value = out.jobInput;
 document.getElementById('up-result').hidden = false;
}

function help() {
 const terms = [
  ['Pack, module, cell', 'An EV battery pack is made of modules, and each module of cells. IDs read like <code>A-M2-C07</code>: pack A, module 2, cell 7. This screen writes them as “Pack A · Module 2 · Cell 7”. “Pack A” is only the batch letter; the pack\'s own identity (model, serial number from its label, VIN from its registration) is shown under the name wherever the documents give it.'],
  ['ESS', 'Energy storage system: a new home or grid battery built from matching used cells.'],
  ['Cell family', 'Cells with the same cell model <em>and</em> the same chemistry (for example <code>AC-NMC-66P · NMC</code>). Only cells of one family are ever combined in an ESS. Chemistry facts and sources: <code>docs/battery-info.md</code>.'],
  ['Second-life health (SoH)', 'Usable capacity divided by the cell\'s original capacity. Cells are in series, so the weakest cell sets the value.'],
  ['QR passport', 'Each ESS gets a passport on Cardano. The QR code on the unit opens it: health, facility, and links to every donor pack.'],
  ['Signed', confHelp.signed + '.'],
  ['Documented', confHelp.documented + '.'],
  ['Estimated', confHelp.estimated + '.'],
  ['Warning', 'A rule found a contradiction between events. Modules named in a warning are not taken apart.'],
  ['Rejected claim', 'An event whose quote could not be found word for word in its document. It is left out of the draft.'],
  ['Held back', 'A module that was not taken apart, or a cell that was not used, always with its reason.'],
 ];
 const faq = [
  ['Does the AI decide which cells are used?', 'No. The AI only extracts what documents say. Deterministic code verifies the quotes and groups the cells; a person signs the result.'],
  ['Why is a module held back when only one event mentions it?', 'Grouping is conservative: an accident or an open warning on a module keeps all of its cells out until a person reviews it.'],
  ['Why is the AI explanation short or missing?', 'AI restrictions may limit the explanation for large batch requests: the model accepts only so much input, its quota can run out, and a paid job must finish within its time limit. The draft is still delivered, and the grouping, held-back items, and their reasons are always complete because code decides them.'],
  ['Why does the demo draft have QR codes if it was never paid?', 'Its passports were written on Cardano Preprod in a test run, without a payment, to try the full chain. The QR codes open those real test passports and are marked as a test run. A paid draft gets its own QR codes when it is signed.'],
  ['Why are NMC cells from one pack not used in an ESS built from NMC cells of another pack?', 'Same chemistry is not enough. A different cell model has a different capacity, internal resistance, format and ageing curve; in one series string the weakest cell sets the capacity and the others age unevenly. Cells of a different chemistry (LFP vs NMC) differ even in their voltage window, so a battery management system cannot charge them together safely. The ESS passports page shows the matrix for the open draft.'],
  ['Can I trust the documents themselves?', 'The system proves what a document says, not that the document is true. Signed documents from service shops reduce this risk.'],
 ];
 return `
 <h1>Help</h1>
 <p class="lead">What the words on this screen mean, and how to move around.</p>
 <div class="help-grid">${terms.map(([t, body]) => `<div class="term"><b>${esc(t)}</b>${body}</div>`).join('')}</div>
 <section class="sec"><div class="sec-head"><h2>Questions</h2></div>${faq.map(([q, a]) => `<details class="faq"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</section>
 <section class="sec"><div class="sec-head"><h2>Keyboard</h2></div>
  <p class="muted">${routes.map(([id, t, k]) => `<kbd>${esc(k)}</kbd> ${esc(t)}`).join(' &nbsp; ')}</p></section>`;
}

// ---------- Interactions ----------

function wire() {
 const upDemo = document.getElementById('up-demo');
 if (upDemo) {
  upDemo.onclick = () => upload({demo: true}, 'the demo batch');
  document.getElementById('up-dir').onchange = async e => {
   const chosen = [...e.target.files];
   if (!chosen.length) return;
   const files = await Promise.all(chosen.map(async f => ({path: f.webkitRelativePath || f.name, text: await f.text()})));
   upload({files}, `${files.length} files`);
  };
  document.getElementById('up-copy').onclick = async () => {
   const t = document.getElementById('up-input');
   try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand('copy'); }
   document.getElementById('up-copied').textContent = 'Copied.';
  };
 }
 const signBtn = document.getElementById('sign-btn');
 if (signBtn) signBtn.onclick = sign;

 for (const b of app.querySelectorAll('[data-pack].pill')) b.onclick = () => { packFilter = b.dataset.pack; route(); };
 for (const b of app.querySelectorAll('[data-open-draft]')) b.onclick = () => show(b.dataset.openDraft);
 for (const b of app.querySelectorAll('[data-expand]')) b.onclick = () => {
  const p = b.dataset.expand; openPacks.has(p) ? openPacks.delete(p) : openPacks.add(p);
  const y = window.scrollY; route({keepScroll: true, quiet: true}); window.scrollTo(0, y); wire();
 };

 // Count numbers up on the overview.
 if (!reduceMotion) for (const el of app.querySelectorAll('[data-count]')) {
  const end = Number(el.dataset.count); if (!Number.isFinite(end) || end < 2) continue;
  const t0 = performance.now(), dur = 900;
  const tick = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))) + (el.dataset.unit || ''); if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
 }

 // Cards tilt towards the mouse.
 if (!reduceMotion && matchMedia('(pointer:fine)').matches) for (const el of app.querySelectorAll('.tilt')) {
  el.onmousemove = e => { const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; el.style.transform = `rotateY(${x * 10}deg) rotateX(${-y * 10}deg) translateY(-4px)`; };
  el.onmouseleave = () => { el.style.transform = ''; };
 }

 // Flow diagram: hovering a pack or module lights up its lines.
 const sk = document.getElementById('sankey');
 if (sk) for (const n of sk.querySelectorAll('.node')) {
  n.onmouseenter = () => { const k = n.dataset.k; sk.classList.add('dim'); for (const l of sk.querySelectorAll('.link')) l.classList.toggle('on', k === 'ess' || l.dataset.k.split(' ').includes(k)); };
  n.onmouseleave = () => { sk.classList.remove('dim'); for (const l of sk.querySelectorAll('.link')) l.classList.remove('on'); };
 }

 // Mosaic legend: click a pack to highlight its cells.
 const mo = document.getElementById('mosaic');
 if (mo) for (const btn of app.querySelectorAll('[data-legend]')) btn.onclick = () => {
  const on = !btn.classList.contains('on');
  for (const b of app.querySelectorAll('[data-legend]')) b.classList.remove('on');
  btn.classList.toggle('on', on); mo.classList.toggle('focus', on);
  for (const c of mo.children) c.classList.toggle('lit', on && c.dataset.pack === btn.dataset.legend);
 };
}

// One tooltip for every element with data-tip.
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t && t.dataset.tip) { tip.textContent = t.dataset.tip; tip.classList.add('show'); } });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) tip.classList.remove('show'); });
document.addEventListener('mousemove', e => { tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; });

async function sign() {
 const btn = document.getElementById('sign-btn'), status = document.getElementById('status');
 btn.disabled = true; status.textContent = 'Signing…';
 const res = await fetch('/api/sign', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({id: current.id, changes: document.getElementById('changes').value})});
 const out = await res.json();
 if (!res.ok) { status.textContent = `Not signed: ${out.error}`; btn.disabled = false; return; }
 // Reload so each ESS passport shows the QR code of its new passport.
 await show(current.id);
 document.getElementById('sign-btn').disabled = true;
 document.getElementById('status').textContent = `Signed. Donor log TxHashes: ${out.donorTxs.join(', ')}\nESS log and passport TxHashes: ${out.newBatteryTxs.join(', ')}\nOpen ESS passports to scan the QR codes.`;
}
refreshStatus();
load();
