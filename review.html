<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery History Review</title>
<style>
:root{--bg:#fff;--panel:#fff;--soft:#f4f4f5;--ink:#0a0a0a;--muted:#71717a;--line:#e4e4e7;--accent:#0a0a0a;--accent-ink:#fff;--good:#15803d;--good-bg:#ecfdf3;--warn:#b45309;--warn-bg:#fff7ed;--bad:#b91c1c;--bad-bg:#fef2f2;--chip:#f4f4f5;--signed:#15803d;--documented:#1d4ed8;--estimated:#7e22ce;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#09090b;--panel:#111113;--soft:#18181b;--ink:#fafafa;--muted:#a1a1aa;--line:#27272a;--accent:#fafafa;--accent-ink:#09090b;--good:#4ade80;--good-bg:#0f2a1a;--warn:#fbbf24;--warn-bg:#2a1f0a;--bad:#f87171;--bad-bg:#2a1010;--chip:#18181b;--signed:#4ade80;--documented:#93c5fd;--estimated:#d8b4fe;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
select,textarea,button{font:inherit;color:inherit}

/* Top bar */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px}
.bar-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar-right a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px}
.bar-right a:hover{background:var(--soft);color:var(--ink)}
select{background:var(--soft);border:1px solid transparent;border-radius:999px;padding:7px 12px;max-width:260px}
.tabs{max-width:1200px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

/* Pills */
.pill{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.pill:hover{background:var(--soft)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill .n{color:var(--muted);margin-left:4px;font-weight:400}
.pill.on .n{color:inherit;opacity:.7}

main{max-width:1200px;margin:0 auto;padding:32px 16px 80px}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.1;letter-spacing:-.03em;margin:0 0 8px}
.hero p{color:var(--muted);margin:0 0 24px;max-width:640px;font-size:16px}
h2{font-size:22px;letter-spacing:-.02em;margin:0}
.sec{margin-top:48px}
.sec-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:6px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:16px;padding:16px}
.stat b{display:block;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}

/* Notes */
.note{padding:12px 14px;border-radius:12px;margin-bottom:8px;font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note .muted{opacity:.8}

/* Timelines */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.card h3{margin:0 0 12px;font-size:16px}
.event{position:relative;padding:0 0 14px 18px;border-left:2px solid var(--line);margin-left:5px}
.event:last-child{padding-bottom:0}
.event::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--muted)}
.event.flagged{border-left-color:var(--warn)}
.event.flagged::before{border-color:var(--warn);background:var(--warn)}
.event .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.type{font-weight:600;text-transform:capitalize}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.conf{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.conf.signed{color:var(--signed)}.conf.documented{color:var(--documented)}.conf.estimated{color:var(--estimated)}
.fields{font-size:13px;color:var(--muted)}
.quote{font-size:13px;margin-top:4px;background:var(--soft);border-radius:8px;padding:6px 8px;overflow-wrap:anywhere}
.quote q{font-style:italic}

/* ESS gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.ess{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease;min-width:0}
.ess:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.preview{background:var(--soft);padding:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.soh b{display:block;font-size:44px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.soh span{color:var(--muted);font-size:13px}
.meter{height:6px;border-radius:999px;background:var(--line);margin-top:10px;overflow:hidden;width:140px}
.meter i{display:block;height:100%;background:var(--good);border-radius:inherit}
.qr{flex:0 0 112px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;font-size:11px;color:var(--muted);text-decoration:none}
.qr svg{width:112px;height:112px;background:#fff;border-radius:10px;padding:4px}
.qr.pending{height:112px;justify-content:center;border:1.5px dashed var(--line);border-radius:12px;padding:8px;background:var(--panel)}
.caption{padding:14px 18px 18px}
.caption .title{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.caption .title b{font-size:16px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";font-weight:600}
details[open] summary::before{content:"− "}
.tree{display:grid;gap:10px;margin-top:10px}
.donor{background:var(--soft);border-radius:12px;padding:10px}
.mods{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.mod{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 5px;font-size:11px;font-variant-numeric:tabular-nums}
.docs{font-size:12px;color:var(--muted);margin:4px 0 0;padding-left:16px;overflow-wrap:anywhere}

/* Sign */
.sign{display:flex;flex-direction:column;gap:10px;max-width:640px}
.sign label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
textarea{width:100%;min-height:72px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink)}
button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;align-self:flex-start}
button:disabled{opacity:.4;cursor:not-allowed}
#status{font-size:14px;white-space:pre-wrap;word-break:break-word}
.muted{color:var(--muted)}
.held-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.held-card{background:var(--bad-bg);border-radius:16px;padding:14px 16px;min-width:0}
.held-card .name{font-weight:700;color:var(--ink)}
.held-card .tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--bad);margin-top:2px}
.held-card ul{margin:8px 0 0;padding-left:18px;color:var(--bad);font-size:14px}
.held-card li{margin:2px 0}
.cell-groups{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cell-group{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.cell-group .where{font-weight:600;color:var(--ink);margin-right:4px}
.cell-group .c{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.sub{color:var(--muted);font-size:13px;margin:16px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
<div class="bar">
 <div class="bar-in">
  <div class="brand"><span class="logo" aria-hidden="true">⚡</span>Battery history review</div>
  <div class="bar-right"><a href="/status">Status</a><label><span class="muted" style="font-size:14px">Draft </span><select id="pick" aria-label="Draft"></select></label></div>
 </div>
 <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>
<main id="app"><p class="muted">Loading…</p></main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = t => t.replace(/_/g, ' ');
// Readable names for codes, for display only. The draft data keeps the original IDs.
const cellRe = /\b([A-Z])-M(\d+)-C0*(\d+)\b/g, moduleRe = /\b([A-Z])-M(\d+)\b/g;
const placeName = id => String(id).replace(cellRe, 'Pack $1 · Module $2 · Cell $3').replace(moduleRe, 'Pack $1 · Module $2');
const ruleNames = {
 soh_after_replacement: 'high health reading soon after a module replacement',
 accident_without_inspection: 'accident with no later health check',
 dates_out_of_order: 'dates out of order',
 health_rising_without_repair: 'health rose without a repair',
};
const sentence = s => s.charAt(0).toUpperCase() + s.slice(1);
// "accident event B-e3; open warning accident_without_inspection (B-e3); not taken apart" -> readable bullet points
const reasonItems = reason => String(reason).split(/;(?!\s*an ESS needs)\s*/).filter(p => p && p !== 'not taken apart').map(p => sentence(placeName(p
 .replace(/^accident event (\S+)/, 'accident recorded (event $1)')
 .replace(/^open warning (\w+)/, (_, rule) => `open warning: ${ruleNames[rule] || label(rule)}`) .replace(/^quote not found at (\S+) page (\d+) line (\d+)/, 'the quoted text is not in $1 at page $2, line $3'))));
const pick = document.getElementById('pick'), app = document.getElementById('app'), tabs = document.getElementById('tabs');
let current, packFilter = 'all';

async function load() {
 const drafts = await (await fetch('/api/drafts')).json();
 pick.innerHTML = drafts.map(d => `<option value="${esc(d.id)}">${esc(d.label)}</option>`).join('');
 if (drafts.length) show(drafts[drafts.length - 1].id); else app.innerHTML = '<p class="muted">No drafts yet.</p>';
 pick.value = drafts.length ? drafts[drafts.length - 1].id : '';
}
pick.onchange = () => { packFilter = 'all'; show(pick.value); };

async function show(id) {
 const r = await (await fetch('/api/draft?id=' + encodeURIComponent(id))).json();
 current = r; render();
}

function render() {
 const r = current, d = r.draft;
 const flagged = new Set(d.warnings.flatMap(w => w.events));
 const ess = d.new_batteries || [];
 const held = d.held_back || [];
 const heldModules = held.filter(h => h.level === 'module'), heldCells = held.filter(h => h.level === 'cell');
 const used = ess.reduce((n, b) => n + b.cells.length, 0);
 const packOf = id => id.split('-')[0];
 // Events name modules as module_ids/cell_ids (team format) or module_id (older battery code).
 const parts = e => [...(e.cell_ids || []), ...(e.cell_ids?.length ? [] : e.module_ids || (e.module_id ? [e.module_id] : []))];
 const shownPacks = packFilter === 'all' ? d.packs : d.packs.filter(p => p === packFilter);

 const event = e => `<div class="event ${flagged.has(e.event_id) ? 'flagged' : ''}">
  <div class="top"><span class="date">${esc(e.date)}</span><span class="type">${esc(label(e.type))}</span>
  <span class="chip">${esc(parts(e).join(', ') || 'whole pack')}</span>
  <span class="conf ${esc(e.confidence)}">${esc(e.confidence)}</span></div>
  <div class="fields">${Object.entries(e.fields || {}).map(([k, v]) => `${esc(label(k))}: ${esc(v)}`).join(' · ')}</div>
  ${e.source ? `<div class="quote"><q>${esc(e.source.quote)}</q> <span class="muted">— ${esc(e.source.doc_id)}, p. ${esc(e.source.page)}, line ${esc(e.source.line)}</span></div>`
   : `<div class="quote muted">Derived from ${esc((e.basis || []).join(', '))}</div>`}
 </div>`;

 const pack = p => `<div class="card"><h3>Pack ${esc(p)}</h3>${d.events.filter(e => e.pack_id === p).sort((a, b) => String(a.date).localeCompare(String(b.date))).map(event).join('') || '<p class="muted">No events.</p>'}</div>`;

 // One card per ESS: what its QR code shows on top, then where its cells came from.
 const essCard = b => {
  const h = b.health || {}, f = b.second_life_facility || {};
  const byModule = {};
  for (const c of b.cells) (byModule[c.module_id] ||= []).push(c.cell_id.split('-').pop());
  const qr = (r.passports || {})[b.battery_id];
  const pct = Math.max(0, Math.min(100, Number(h.soh_pct) || 0));
  return `<article class="ess">
   <div class="preview">
    <div class="soh"><b>${esc(h.soh_pct)}%</b><span>second-life health</span><div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div></div>
    ${qr ? `<a class="qr" href="${esc(qr.url)}" target="_blank" rel="noopener" title="Passport transaction ${esc(qr.txHash)}">${qr.svg}<span>Scan: passport on Cardano Preprod</span></a>`
     : '<div class="qr pending"><span>QR code appears once the passport is on-chain (after signing)</span></div>'}
   </div>
   <div class="caption">
    <div class="title"><b>${esc(b.battery_id)}</b><span class="meta">${esc(h.cell_count)} cells</span></div>
    <div class="meta">${esc(f.name)} · ${esc(f.site)}</div>
    <div class="tags">
     <span class="chip">${esc(h.usable_capacity_ah)} / ${esc(h.nominal_capacity_ah)} Ah</span>
     <span class="chip">${esc(b.cell_model)}</span><span class="chip">${esc(b.chemistry)}</span>
     <span class="chip">Packs ${esc((b.donor_packs || []).join(', '))}</span>
    </div>
    <div class="meta" style="margin-top:10px">Tested ${esc((h.cells_tested_on || []).join(', '))} · ${esc(h.basis)} · capacity ±${esc(b.rules?.capacity_band_pct)}%, resistance ±${esc(b.rules?.resistance_band_pct)}%</div>
    <details><summary>Family tree: ${esc(b.battery_id)} → modules → donor packs → documents</summary>
     <div class="tree">${(b.donor_packs || []).map(p => `<div class="donor"><b>Pack ${esc(p)}</b>
      ${Object.keys(byModule).filter(m => packOf(m) === p).map(m => `<div class="mods"><span class="chip">${esc(m)}</span>${byModule[m].map(n => `<span class="mod">${esc(n)}</span>`).join('')}</div>`).join('')}
      <ul class="docs">${d.documents.filter(x => x.pack_id === p).map(x => `<li>${esc(x.doc_id)} <span title="${esc(x.sha256)}">${esc(String(x.sha256).slice(0, 10))}…</span>${x.anchor_tx ? ' · anchored' : ''}</li>`).join('')}</ul></div>`).join('')}</div>
    </details>
   </div>
  </article>`;
 };
 // Many left-over cells share one reason; show each reason once with its cells.
 const groupedReasons = list => { const g = new Map(); for (const h of list) (g.get(h.reason) || g.set(h.reason, []).get(h.reason)).push(h.id); return [...g]; };
 // ["B-M3-C05", "B-M3-C08", "C-M2-C01"] -> [["B-M3", ["5", "8"]], ["C-M2", ["1"]]]
 const cellsByModule = ids => { const g = new Map(); for (const id of ids) { const m = /^(.*)-C0*(\d+)$/.exec(id); const [mod, n] = m ? [m[1], m[2]] : [id, '?']; (g.get(mod) || g.set(mod, []).get(mod)).push(n); } return [...g]; };

 const sections = [
  ['overview', 'Overview', null],
  d.warnings.length && ['warnings', 'Warnings', d.warnings.length],
  d.rejected.length && ['rejected', 'Rejected', d.rejected.length],
  ['histories', 'Donor histories', d.packs.length],
  ['ess', 'ESS passports', ess.length],
  held.length && ['held', 'Held back', held.length],
  ['sign', 'Sign', null],
 ].filter(Boolean);
 tabs.innerHTML = sections.map(([id, name, n]) => `<a class="pill" href="#${id}">${esc(name)}${n != null ? `<span class="n">${esc(n)}</span>` : ''}</a>`).join('');

 app.innerHTML = `
 <section class="hero" id="overview">
  <h1>${esc(d.packs.length)} donor packs, ${esc(ess.length)} new ESS units</h1>
  <p>Every event below is quoted from a source document and checked by code. Cells were grouped by deterministic rules; the AI only reports what the documents say.</p>
  <div class="stats">
   <div class="stat"><b>${esc(d.events.length)}</b><span>verified events</span></div>
   <div class="stat"><b>${esc(d.warnings.length)}</b><span>warnings</span></div>
   <div class="stat"><b>${esc(d.rejected.length)}</b><span>rejected claims</span></div>
   <div class="stat"><b>${esc(used)}</b><span>cells in ${esc(ess.length)} ESS units</span></div>
   <div class="stat"><b>${esc(heldModules.length)} / ${esc(heldCells.length)}</b><span>modules / cells held back</span></div>
  </div>
 </section>
 ${d.warnings.length ? `<section class="sec" id="warnings"><div class="sec-head"><h2>Warnings</h2></div>${d.warnings.map(w => `<div class="note warn">${esc(w.message)} <span class="muted">(${esc(w.events.join(', '))})</span></div>`).join('')}</section>` : ''}
 ${d.rejected.length ? `<section class="sec" id="rejected"><div class="sec-head"><div><h2>Rejected by verification</h2><p>Claims whose quote is not in the document.</p></div></div><div class="held-grid">${d.rejected.map(x => `<div class="held-card"><div class="name">Claim ${esc(x.event_id)}${/^[A-Z]-/.test(x.event_id || '') ? ` <span class="muted">· Pack ${esc(x.event_id[0])}</span>` : ''}</div><span class="tag">Rejected</span>
  <ul>${reasonItems(x.reason).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}</div></section>` : ''}
 <section class="sec" id="histories">
  <div class="sec-head"><div><h2>Donor histories</h2><p>Timeline per pack. Highlighted dots are part of a warning.</p></div>
   <div class="filters">${['all', ...d.packs].map(p => `<button type="button" class="pill ${packFilter === p ? 'on' : ''}" data-pack="${esc(p)}">${p === 'all' ? 'All' : 'Pack ' + esc(p)}</button>`).join('')}</div></div>
  <div class="packs">${shownPacks.map(pack).join('')}</div>
 </section>
 <section class="sec" id="ess"><div class="sec-head"><div><h2>New ESS units and their QR passports</h2><p>What the QR code on each unit shows.</p></div></div>
  <div class="gallery">${ess.map(essCard).join('') || '<p class="muted">No ESS proposed.</p>'}</div></section>
 ${held.length ? `<section class="sec" id="held"><div class="sec-head"><h2>Held back</h2></div>
  ${heldModules.length ? `<p class="sub">Modules not taken apart</p><div class="held-grid">${heldModules.map(h => `<div class="held-card">
   <div class="name">${esc(placeName(h.id))}</div><span class="tag">Not taken apart</span>
   <ul>${reasonItems(h.reason).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}</div>` : ''}
  ${heldCells.length ? `<p class="sub">Cells not used</p><div class="held-grid">${groupedReasons(heldCells).map(([reason, ids]) => `<div class="held-card">
   <div class="name">${esc(ids.length)} cell${ids.length === 1 ? '' : 's'}</div><span class="tag">Not used</span>
   <ul>${reasonItems(reason).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
   <div class="cell-groups">${cellsByModule(ids).map(([mod, cells]) => `<div class="cell-group"><span class="where">${esc(placeName(mod))}</span>${cells.map(n => `<span class="c">Cell ${esc(n)}</span>`).join('')}</div>`).join('')}</div>
  </div>`).join('')}</div>` : ''}
 </section>` : ''}
 <section class="sec sign" id="sign"><h2>Sign and publish</h2>
  ${r.paid ? '<p>Signing confirms this draft is the one paid for through Masumi, records your signature, and writes the donor and ESS event logs and passports on Cardano Preprod.</p>'
   : '<p class="muted">This is the demo draft. Only a paid draft can be signed.</p>'}
  <label>Changes from the draft (optional)<textarea id="changes" placeholder="none"></textarea></label>
  <button id="sign-btn" ${r.paid ? '' : 'disabled'}>Sign and publish</button>
  <div id="status"></div>
 </section>`;
 document.getElementById('sign-btn').onclick = sign;
 for (const b of app.querySelectorAll('[data-pack]')) b.onclick = () => {
  packFilter = b.dataset.pack; const y = window.scrollY; render(); window.scrollTo(0, y);
 };
}

async function sign() {
 const btn = document.getElementById('sign-btn'), status = document.getElementById('status');
 btn.disabled = true; status.textContent = 'Signing…';
 const res = await fetch('/api/sign', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({id: current.id, changes: document.getElementById('changes').value})});
 const out = await res.json();
 if (!res.ok) { status.textContent = `Not signed: ${out.error}`; btn.disabled = false; return; }
 // Reload so each ESS card shows the QR code of its new passport.
 await show(current.id);
 document.getElementById('sign-btn').disabled = true;
 document.getElementById('status').textContent = `Signed. Donor log TxHashes: ${out.donorTxs.join(', ')}\nESS log and passport TxHashes: ${out.newBatteryTxs.join(', ')}`;
}
load();
</script>
</body>
</html>
