<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery History Review</title>
<style>
:root{--bg:#fbfbfa;--panel:#fff;--soft:#f3f3f1;--ink:#0b0b0c;--muted:#6f6f78;--line:#e6e6e3;--accent:#0b0b0c;--accent-ink:#fff;
 --good:#16a34a;--warn:#b45309;--warn-bg:#fff7ed;--bad:#b91c1c;--bad-bg:#fef2f2;--chip:#f1f1ef;
 --signed:#15803d;--documented:#1d4ed8;--estimated:#7e22ce;
 --pa:#6366f1;--pb:#f97316;--pc:#14b8a6;--blob1:#c7d2fe;--blob2:#fed7aa;--blob3:#99f6e4;
 --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#08080a;--panel:#111114;--soft:#18181c;--ink:#f5f5f4;--muted:#a1a1aa;--line:#26262b;--accent:#f5f5f4;--accent-ink:#08080a;
 --good:#4ade80;--warn:#fbbf24;--warn-bg:#2a1f0a;--bad:#f87171;--bad-bg:#2a1010;--chip:#1c1c21;
 --signed:#4ade80;--documented:#93c5fd;--estimated:#d8b4fe;
 --pa:#818cf8;--pb:#fb923c;--pc:#2dd4bf;--blob1:#312e81;--blob2:#7c2d12;--blob3:#134e4a;
 --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
select,textarea,button{font:inherit;color:inherit}

/* Floating background blobs */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;width:42vmax;height:42vmax;border-radius:50%;filter:blur(80px);opacity:.45;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:var(--blob1);left:-12vmax;top:-14vmax}
.blobs i:nth-child(2){background:var(--blob2);right:-14vmax;top:20vh;animation-duration:26s;animation-delay:-6s}
.blobs i:nth-child(3){background:var(--blob3);left:20vw;bottom:-22vmax;animation-duration:30s;animation-delay:-12s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}

/* Top bar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;text-decoration:none}
.logo{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:15px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.brand:hover .logo{transform:rotate(-12deg) scale(1.15)}
.bar-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar-right a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px}
.bar-right a:hover{background:var(--soft);color:var(--ink)}
select{background:var(--soft);border:1px solid transparent;border-radius:999px;padding:7px 12px;max-width:240px}
.nav{max-width:1200px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}

/* Pills */
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap;transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s}
.pill:hover{transform:translateY(-2px);background:var(--soft)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill .n{opacity:.6;font-weight:400}
.pill .k{font-size:11px;opacity:.45;border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:1.3}

main{max-width:1200px;margin:0 auto;padding:36px 16px 96px;min-height:70vh}
.page{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:clamp(30px,5.4vw,56px);line-height:1.04;letter-spacing:-.035em;margin:0 0 12px}
h2{font-size:22px;letter-spacing:-.02em;margin:0}
.lead{color:var(--muted);margin:0 0 28px;max-width:660px;font-size:17px}
.sec{margin-top:44px}
.sec-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:12px;margin:24px 0 10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:18px;transition:transform .2s}
.back:hover{color:var(--ink);transform:translateX(-4px)}

/* Overview hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.gradient{background:linear-gradient(100deg,var(--pa),var(--pb) 50%,var(--pc));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shine 8s ease-in-out infinite alternate}
@keyframes shine{to{background-position:100% 0}}
.battery-art{display:flex;flex-direction:column;align-items:center;gap:8px}
.battery-art svg{width:min(260px,70vw);height:auto;overflow:visible;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.battery-art:hover svg{transform:rotate(-4deg) scale(1.05)}
.wave{animation:wave 4s linear infinite}
.wave.two{animation-duration:6.5s;opacity:.55}
@keyframes wave{to{transform:translateX(-200px)}}
.battery-art .cap{font-size:13px;color:var(--muted);text-align:center}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:block;background:color-mix(in srgb,var(--panel) 80%,transparent);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-decoration:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.stat:hover{transform:translateY(-4px) scale(1.03);box-shadow:var(--shadow)}
.stat b{display:block;font-size:32px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}

/* Process flow */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;counter-reset:step}
.step{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;overflow:hidden;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s}
.step::before{counter-increment:step;content:counter(step,decimal-leading-zero);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.step .ico{font-size:26px;display:block;margin:6px 0 4px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.step b{display:block}
.step p{margin:4px 0 0;color:var(--muted);font-size:13px;max-height:0;opacity:0;transition:max-height .35s,opacity .35s}
.step:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:var(--shadow);border-color:var(--ink)}
.step:hover .ico{transform:scale(1.35) rotate(-10deg)}
.step:hover p,.step:focus-visible p{max-height:120px;opacity:1}
@media (hover:none){.step p{max-height:none;opacity:1}}

/* Notes and red cards */
.note{display:block;padding:12px 14px;border-radius:14px;margin-bottom:8px;font-size:14px;text-decoration:none;transition:transform .2s}
.note:hover{transform:translateX(4px)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.held-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.held-card{background:var(--bad-bg);border-radius:18px;padding:14px 16px;min-width:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.held-card:hover{transform:translateY(-4px) rotate(.4deg);box-shadow:var(--shadow)}
.held-card .name{font-weight:700;color:var(--ink)}
.held-card .tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--bad);margin-top:2px}
.held-card ul{margin:8px 0 0;padding-left:18px;color:var(--bad);font-size:14px}
.ai{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0 0;font-size:14px;color:var(--ink);max-width:760px}
.ai .who{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.held-card li{margin:2px 0}
.cell-groups{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cell-group{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.cell-group .where{font-weight:600;margin-right:4px}
.c{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;font-variant-numeric:tabular-nums;transition:transform .15s}
.c:hover{transform:scale(1.25)}

/* Timelines */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0}
.card h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.event{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:5px;border-radius:0 12px 12px 0;transition:background .2s}
.event:last-child{padding-bottom:0}
.event::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--muted);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.event:hover::before{transform:scale(1.6)}
.event:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.event.flagged{border-left-color:var(--warn)}
.event.flagged::before{border-color:var(--warn);background:var(--warn);box-shadow:0 0 0 0 var(--warn);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.event .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.type{font-weight:600;text-transform:capitalize}
.chip{background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;font-variant-numeric:tabular-nums}
.conf{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.conf.signed{color:var(--signed)}.conf.documented{color:var(--documented)}.conf.estimated{color:var(--estimated)}
.fields{font-size:13px;color:var(--muted)}
.quote{font-size:13px;margin-top:4px;background:var(--soft);border-radius:10px;padding:6px 9px;overflow-wrap:anywhere}
.quote q{font-style:italic}

/* ESS gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;perspective:1000px}
.ess{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden;transform-style:preserve-3d;transition:transform .2s ease-out,box-shadow .3s;will-change:transform}
.ess:hover{box-shadow:var(--shadow)}
.preview{position:relative;padding:22px;display:flex;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,color-mix(in srgb,var(--pa) 14%,var(--soft)),color-mix(in srgb,var(--pc) 14%,var(--soft)))}
.soh b{display:block;font-size:46px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.soh span{color:var(--muted);font-size:13px}
.ring{width:88px;height:88px;flex:0 0 88px;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.ess:hover .ring{transform:rotate(200deg) scale(1.08)}
.mix{display:flex;height:6px;border-radius:999px;overflow:hidden;margin-top:12px}
.mix i{display:block;height:100%}
.caption{padding:14px 18px 18px}
.caption .title{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.caption .title b{font-size:17px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.open{margin-top:12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;transition:gap .2s}
.ess:hover .open{gap:12px}

/* ESS detail */
.detail-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
@media (max-width:720px){.detail-top{grid-template-columns:1fr}}
.qr{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-size:12px;color:var(--muted);text-decoration:none;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.qr:hover{transform:scale(1.08) rotate(2deg)}
.qr svg{width:170px;height:170px;background:#fff;border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.qr.pending{width:170px;height:170px;justify-content:center;border:2px dashed var(--line);border-radius:16px;padding:12px;background:var(--panel)}
.bigstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:20px}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:22px}
.cell{aspect-ratio:1;border-radius:8px;position:relative;cursor:default;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,filter .25s;animation:pop .5s cubic-bezier(.34,1.56,.64,1) backwards}
.cell::after{content:"";position:absolute;left:28%;right:28%;top:-3px;height:4px;border-radius:2px 2px 0 0;background:inherit;filter:brightness(.8)}
.cell:hover{transform:scale(1.55);z-index:2;box-shadow:var(--shadow)}
.mosaic.focus .cell:not(.lit){filter:grayscale(1) opacity(.25)}
@keyframes pop{from{transform:scale(0)}}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;transition:transform .2s}
.legend button:hover,.legend button.on{transform:translateY(-2px);border-color:var(--ink)}
.sankey-wrap{overflow-x:auto;border-radius:22px;-webkit-overflow-scrolling:touch}
.sankey{width:100%;min-width:620px;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:22px}
.sankey .link{fill:none;stroke-opacity:.35;transition:stroke-opacity .2s}
.sankey.dim .link{stroke-opacity:.07}
.sankey.dim .link.on{stroke-opacity:.8}
.sankey .node rect{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.sankey .node:hover rect{transform:scale(1.15)}
.sankey text{font:12px system-ui,sans-serif;fill:var(--ink)}
.sankey .small{fill:var(--muted);font-size:11px}
.docs{font-size:13px;color:var(--muted);margin:6px 0 0;padding-left:18px;overflow-wrap:anywhere}

/* Tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:8px;opacity:0;transform:translate(-50%,-130%) scale(.9);transition:opacity .12s,transform .12s;white-space:nowrap}
#tip.show{opacity:1;transform:translate(-50%,-130%) scale(1)}

/* Help */
.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.term{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.term:hover{transform:translateY(-4px) scale(1.02);box-shadow:var(--shadow)}
.term b{display:block;font-size:16px;margin-bottom:4px}
.term code{background:var(--chip);border-radius:6px;padding:1px 6px;font-size:13px}
details.faq{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;transition:border-color .2s}
details.faq:hover{border-color:var(--ink)}
details.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";transition:transform .3s;font-size:20px;line-height:1}
details.faq[open] summary::after{transform:rotate(45deg)}
details.faq p{color:var(--muted);margin:8px 0 2px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12px;background:var(--panel)}

/* Sign */
.sign{display:flex;flex-direction:column;gap:12px;max-width:640px}
.sign label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
textarea{width:100%;min-height:88px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;align-self:flex-start;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.btn:hover:not(:disabled){transform:scale(1.06)}
.btn:disabled{opacity:.4;cursor:not-allowed}
#status{font-size:14px;white-space:pre-wrap;word-break:break-word}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="bar">
 <div class="bar-in">
  <a class="brand" href="#/overview"><span class="logo" aria-hidden="true">⚡</span>Battery history review</a>
  <div class="bar-right"><a href="/status">Status</a><label><span class="muted" style="font-size:14px">Draft </span><select id="pick" aria-label="Draft"></select></label></div>
 </div>
 <nav class="nav" id="nav" aria-label="Pages"></nav>
</div>
<main id="app"><p class="muted">Loading…</p></main>
<div id="tip" role="tooltip"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = t => String(t).replace(/_/g, ' ');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Readable names for codes, for display only. The draft data keeps the original IDs.
const cellRe = /\b([A-Z])-M(\d+)-C0*(\d+)\b/g, moduleRe = /\b([A-Z])-M(\d+)\b/g;
const placeName = id => String(id).replace(cellRe, 'Pack $1 · Module $2 · Cell $3').replace(moduleRe, 'Pack $1 · Module $2');
const shortName = id => String(id).replace(cellRe, '$1 · M$2 · C$3').replace(moduleRe, '$1 · M$2');
const ruleNames = {
 soh_after_replacement: 'high health reading soon after a module replacement',
 accident_without_inspection: 'accident with no later health check',
 dates_out_of_order: 'dates out of order',
 health_rising_without_repair: 'health rose without a repair',
};
const sentence = s => s.charAt(0).toUpperCase() + s.slice(1);
// The model's plain-language explanation of the grouping (draft.explanation). Code made the decision; this only explains it.
const aiNote = text => text ? `<p class="ai"><span class="who">AI explanation · check against the rules and events</span>${esc(text)}</p>` : '';
const explanation = () => current.draft.explanation || {ess: {}, modules: {}, cells: []};
// AI limits (input size, model quota, the job's time limit) can shorten or skip the explanation for large batches.
const aiLimitNote = () => current.draft.explanation
 ? '<p class="muted">AI restrictions may limit the explanation for large batch requests. The grouping itself is decided by code and is always complete.</p>'
 : '<div class="note warn">This draft has no AI explanation. AI restrictions (input size, model quota, and the job\'s time limit) may limit or skip the explanation for large batch requests. The grouping, held-back items, and their reasons are decided by code and are complete.</div>';
const reasonItems = reason => String(reason).split(/;(?!\s*an ESS needs)\s*/).filter(p => p && p !== 'not taken apart').map(p => sentence(placeName(p
 .replace(/^accident event (\S+)/, 'accident recorded (event $1)')
 .replace(/^open warning (\w+)/, (_, rule) => `open warning: ${ruleNames[rule] || label(rule)}`)
 .replace(/^quote not found at (\S+) page (\d+) line (\d+)/, 'the quoted text is not in $1 at page $2, line $3'))));
const packOf = id => String(id).split('-')[0];
const packColor = p => ({A: 'var(--pa)', B: 'var(--pb)', C: 'var(--pc)'})[p] || 'var(--muted)';
// Many items share one reason; group them. ["B-M3-C05", "B-M3-C08"] -> [["B-M3", ["5", "8"]]]
const groupBy = (list, key) => { const g = new Map(); for (const x of list) { const k = key(x); (g.get(k) || g.set(k, []).get(k)).push(x); } return [...g]; };
const cellsByModule = ids => groupBy(ids, id => id.replace(/-C\d+$/, '')).map(([m, cs]) => [m, cs.map(id => id.replace(/^.*-C0*/, ''))]);

const pick = document.getElementById('pick'), app = document.getElementById('app'), nav = document.getElementById('nav'), tip = document.getElementById('tip');
let current = null;

const routes = [
 ['overview', 'Overview', '1'],
 ['histories', 'Donor histories', '2'],
 ['ess', 'ESS passports', '3'],
 ['held', 'Held back', '4'],
 ['sign', 'Sign', '5'],
 ['help', 'Help', '?'],
];

async function load() {
 const drafts = await (await fetch('/api/drafts')).json();
 pick.innerHTML = drafts.map(d => `<option value="${esc(d.id)}">${esc(d.label)}</option>`).join('');
 if (!drafts.length) { app.innerHTML = '<p class="muted">No drafts yet.</p>'; return; }
 pick.value = drafts[drafts.length - 1].id;
 await show(pick.value);
}
pick.onchange = () => show(pick.value);
async function show(id) { current = await (await fetch('/api/draft?id=' + encodeURIComponent(id))).json(); route(); }

window.addEventListener('hashchange', route);
function route() {
 if (!current) return;
 const [name = 'overview', arg] = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
 const d = current.draft;
 const counts = {histories: d.packs.length, ess: (d.new_batteries || []).length, held: (d.held_back || []).length + d.rejected.length};
 nav.innerHTML = routes.map(([id, title, key]) => `<a class="pill ${id === name ? 'on' : ''}" href="#/${id}">${esc(title)}${counts[id] != null ? `<span class="n">${esc(counts[id])}</span>` : ''}<span class="k" aria-hidden="true">${esc(key)}</span></a>`).join('');
 const pages = {overview, histories, ess: arg ? essDetail.bind(null, arg) : essGallery, held, sign: signPage, help};
 app.innerHTML = `<div class="page">${(pages[name] || notFound)()}</div>`;
 window.scrollTo({top: 0, behavior: 'instant'});
 wire();
}

// Keyboard: 1-5 and ? jump between pages.
document.addEventListener('keydown', e => {
 if (e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
 const r = routes.find(([, , key]) => key === e.key);
 if (r) location.hash = '#/' + r[0];
});

// ---------- Pages ----------

function overview() {
 const d = current.draft, ess = d.new_batteries || [], held = d.held_back || [];
 const used = ess.reduce((n, b) => n + b.cells.length, 0);
 const avg = ess.length ? ess.reduce((n, b) => n + (Number(b.health?.soh_pct) || 0), 0) / ess.length : 0;
 const fill = Math.max(0, Math.min(100, avg));
 const level = 220 - fill * 1.8; // y of the liquid surface inside the battery drawing
 const wave = y => `M0 ${y} q25 -9 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V230 H0 Z`;
 const steps = [
  ['📄', 'Documents', 'Invoices, registrations and reports are uploaded and fingerprinted (SHA-256).', 'histories'],
  ['🔍', 'Verify', 'Code checks every quote word for word at its page and line. Missing quotes are rejected.', 'held'],
  ['⚠️', 'Warnings', 'Rules look for contradictions, like a high health value right after a module replacement.', 'histories'],
  ['🧩', 'Screen modules', 'Modules with an accident or open warning are not taken apart.', 'held'],
  ['🔋', 'Group cells', 'Matching cells are combined into new ESS units. Health follows the weakest cell.', 'ess'],
  ['⛓️', 'Sign & publish', 'A person signs; event logs and QR passports go on Cardano.', 'sign'],
 ];
 return `
 <section class="hero">
  <div>
   <h1><span class="gradient">${esc(d.packs.length)} old packs</span><br>became ${esc(ess.length)} new batteries</h1>
   <p class="lead">Every fact here is quoted from a source document and checked by code. The AI is a clerk, not a witness: it reports what the documents say. Rules decide which cells go together.</p>
   <div class="stats">
    <a class="stat" href="#/histories"><b data-count="${esc(d.events.length)}">${esc(d.events.length)}</b><span>verified events</span></a>
    <a class="stat" href="#/histories"><b data-count="${esc(d.warnings.length)}">${esc(d.warnings.length)}</b><span>warnings</span></a>
    <a class="stat" href="#/held"><b data-count="${esc(d.rejected.length)}">${esc(d.rejected.length)}</b><span>rejected claims</span></a>
    <a class="stat" href="#/ess"><b data-count="${esc(used)}">${esc(used)}</b><span>cells reused</span></a>
   </div>
  </div>
  <div class="battery-art" aria-label="Average second-life health ${esc(avg.toFixed(1))}%">
   <svg viewBox="0 0 200 250" role="img">
    <defs>
     <clipPath id="body"><rect x="20" y="30" width="160" height="200" rx="26"/></clipPath>
     <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--pa)"/><stop offset=".5" stop-color="var(--pb)"/><stop offset="1" stop-color="var(--pc)"/></linearGradient>
    </defs>
    <rect x="70" y="12" width="60" height="24" rx="8" fill="var(--ink)"/>
    <rect x="20" y="30" width="160" height="200" rx="26" fill="var(--soft)"/>
    <g clip-path="url(#body)">
     <path class="wave two" d="${wave(level + 4)}" fill="url(#liquid)" transform="translate(0 0)"/>
     <path class="wave" d="${wave(level)}" fill="url(#liquid)"/>
    </g>
    <rect x="20" y="30" width="160" height="200" rx="26" fill="none" stroke="var(--ink)" stroke-width="6"/>
    <text x="100" y="140" text-anchor="middle" font-size="40" font-weight="800" fill="var(--ink)" style="paint-order:stroke;stroke:var(--bg);stroke-width:6px">${esc(avg.toFixed(1))}%</text>
   </svg>
   <div class="cap">average second-life health of the new ESS units</div>
  </div>
 </section>
 <section class="sec"><div class="sec-head"><div><h2>How it works</h2><p>Hover a step to read it, click to jump to that page.</p></div></div>
  <div class="flow">${steps.map(([ico, t, p, to]) => `<a class="step" href="#/${to}"><span class="ico">${ico}</span><b>${esc(t)}</b><p>${esc(p)}</p></a>`).join('')}</div>
 </section>
 ${d.warnings.length ? `<section class="sec"><div class="sec-head"><h2>Warnings</h2></div>${d.warnings.map(w => `<a class="note warn" href="#/histories">${esc(placeName(w.message))} <span class="muted">(${esc(w.events.join(', '))})</span></a>`).join('')}</section>` : ''}
 <section class="sec"><div class="sec-head"><div><h2>Modules held back</h2><p>${esc(held.filter(h => h.level === 'module').length)} modules were not taken apart.</p></div><a class="pill" href="#/held">See all</a></div>
  <div class="tags">${held.filter(h => h.level === 'module').map(h => `<span class="chip" data-tip="${esc(reasonItems(h.reason).join(' · '))}">${esc(placeName(h.id))}</span>`).join('')}</div>
 </section>`;
}

function histories() {
 const d = current.draft, flagged = new Set(d.warnings.flatMap(w => w.events));
 const filter = sessionFilter();
 const shown = filter === 'all' ? d.packs : d.packs.filter(p => p === filter);
 // Events name modules as module_ids/cell_ids (team format) or module_id (older battery code).
 const parts = e => [...(e.cell_ids || []), ...(e.cell_ids?.length ? [] : e.module_ids || (e.module_id ? [e.module_id] : []))];
 const event = e => `<div class="event ${flagged.has(e.event_id) ? 'flagged' : ''}">
  <div class="top"><span class="date">${esc(e.date)}</span><span class="type">${esc(label(e.type))}</span>
  <span class="chip">${esc(parts(e).map(shortName).join(', ') || 'whole pack')}</span>
  <span class="conf ${esc(e.confidence)}" data-tip="${esc(confHelp[e.confidence] || '')}">${esc(e.confidence)}</span></div>
  <div class="fields">${Object.entries(e.fields || {}).map(([k, v]) => `${esc(label(k))}: ${esc(v)}`).join(' · ')}</div>
  ${e.source ? `<div class="quote"><q>${esc(e.source.quote)}</q> <span class="muted">— ${esc(e.source.doc_id)}, p. ${esc(e.source.page)}, line ${esc(e.source.line)}</span></div>`
   : `<div class="quote muted">Derived from ${esc((e.basis || []).join(', '))}</div>`}
 </div>`;
 const pack = p => `<div class="card"><h3><span class="dot" style="background:${packColor(p)}"></span>Pack ${esc(p)}</h3>${d.events.filter(e => e.pack_id === p).sort((a, b) => String(a.date).localeCompare(String(b.date))).map(event).join('') || '<p class="muted">No events.</p>'}</div>`;
 return `
 <h1>Donor histories</h1>
 <p class="lead">One timeline per old battery pack. Pulsing dots are part of a warning. Hover a confidence label to see what it means.</p>
 ${d.warnings.length ? d.warnings.map(w => `<div class="note warn">${esc(placeName(w.message))}</div>`).join('') : ''}
 <div class="sec-head" style="margin-top:24px"><span></span><div class="tags">${['all', ...d.packs].map(p => `<button type="button" class="pill ${filter === p ? 'on' : ''}" data-pack="${esc(p)}">${p === 'all' ? 'All packs' : `<span class="dot" style="background:${packColor(p)}"></span>Pack ` + esc(p)}</button>`).join('')}</div></div>
 <div class="packs">${shown.map(pack).join('')}</div>`;
}
const confHelp = {signed: 'Signed by the source itself', documented: 'Quoted from a document whose hash is anchored', estimated: 'Concluded from other events; never used for grouping'};
let packFilter = 'all';
const sessionFilter = () => packFilter;

const sohRing = (pct, size = 88) => {
 const r = 36, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, Number(pct) || 0));
 return `<svg class="ring" viewBox="0 0 88 88" width="${size}" height="${size}" aria-hidden="true">
  <circle cx="44" cy="44" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
  <circle cx="44" cy="44" r="${r}" fill="none" stroke="var(--good)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 44 44)"/>
 </svg>`;
};
const packMix = b => { const g = groupBy(b.cells, c => c.donor_pack || packOf(c.module_id)); return `<div class="mix" aria-hidden="true">${g.map(([p, cs]) => `<i style="width:${(cs.length / b.cells.length * 100).toFixed(2)}%;background:${packColor(p)}"></i>`).join('')}</div>`; };

  const h = b.health || {}, f = b.second_life_facility || {};
  return `<a class="ess tilt" href="#/ess/${encodeURIComponent(b.battery_id)}">

function essDetail(id) {
 const d = current.draft, b = (d.new_batteries || []).find(x => x.battery_id === id);
 if (!b) return notFound();
 const h = b.health || {}, f = b.second_life_facility || {}, qr = (current.passports || {})[b.battery_id];
 const mods = groupBy(b.cells, c => c.module_id).sort((x, y) => x[0].localeCompare(y[0], 'en', {numeric: true}));
 const packs = groupBy(b.cells, c => c.donor_pack || packOf(c.module_id)).sort((x, y) => x[0].localeCompare(y[0]));

 // Flow diagram: donor packs -> modules -> this ESS. Line width = number of cells.
 const rowH = 26, top = 30, H = Math.max(top * 2 + mods.length * rowH, 260), W = 760;
 const xP = 110, xM = 400, xE = 650;
 const modY = new Map(mods.map(([m], i) => [m, top + i * rowH + rowH / 2]));
 const packY = new Map(packs.map(([p]) => { const ys = mods.filter(([m]) => packOf(m) === p).map(([m]) => modY.get(m)); return [p, (Math.min(...ys) + Math.max(...ys)) / 2]; }));
 const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`; };
 const yE = H / 2;
 const sankey = `<svg class="sankey" id="sankey" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cells flow from donor packs through modules into ${esc(b.battery_id)}">
  ${mods.map(([m, cs]) => { const p = packOf(m), w = 1.5 + cs.length * 1.6; return `
   <path class="link" data-k="${esc(m)} ${esc(p)}" d="${curve(xP + 14, packY.get(p), xM - 6, modY.get(m))}" stroke="${packColor(p)}" stroke-width="${w}"/>
   <path class="link" data-k="${esc(m)} ${esc(p)}" d="${curve(xM + 6, modY.get(m), xE - 14, yE)}" stroke="${packColor(p)}" stroke-width="${w}"/>`; }).join('')}
  ${packs.map(([p, cs]) => `<g class="node" data-k="${esc(p)}" data-tip="Pack ${esc(p)}: ${esc(cs.length)} cells"><rect x="${xP - 14}" y="${packY.get(p) - 22}" width="28" height="44" rx="8" fill="${packColor(p)}"/><text x="${xP - 24}" y="${packY.get(p) + 4}" text-anchor="end" font-weight="700">Pack ${esc(p)}</text></g>`).join('')}
  ${mods.map(([m, cs]) => `<g class="node" data-k="${esc(m)}" data-tip="${esc(placeName(m))}: ${esc(cs.length)} cells used"><rect x="${xM - 6}" y="${modY.get(m) - 8}" width="12" height="16" rx="3" fill="${packColor(packOf(m))}"/><text x="${xM + 14}" y="${modY.get(m) + 4}" class="small">${esc(shortName(m))} · ${esc(cs.length)}</text></g>`).join('')}
  <g class="node" data-k="ess" data-tip="${esc(b.battery_id)}: ${esc(b.cells.length)} cells"><rect x="${xE - 14}" y="${yE - 40}" width="28" height="80" rx="10" fill="var(--ink)"/><text x="${xE + 24}" y="${yE + 4}" font-weight="700">${esc(b.battery_id)}</text></g>
 </svg>`;

 return `
 <a class="back" href="#/ess">← All ESS passports</a>
 <div class="detail-top">
  <div>
   <h1>${esc(b.battery_id)} <span class="muted" style="font-weight:500">passport</span></h1>
   <p class="lead" style="margin-bottom:0">Made at <b>${esc(f.name)}</b>, ${esc(f.site)}. ${esc(h.cell_count)} ${esc(b.cell_model)} ${esc(b.chemistry)} cells in series, tested ${esc((h.cells_tested_on || []).join(', '))} (${esc(h.basis)}).</p>
   <div class="bigstats">
    <div class="stat"><b>${esc(h.soh_pct)}%</b><span>second-life health</span></div>
    <div class="stat"><b>${esc(h.usable_capacity_ah)} Ah</b><span>usable of ${esc(h.nominal_capacity_ah)} Ah (weakest cell)</span></div>
    <div class="stat"><b>${esc(packs.length)}</b><span>donor packs</span></div>
    <div class="stat"><b>${esc(mods.length)}</b><span>donor modules</span></div>
   </div>
  </div>
  ${qr ? `<a class="qr" href="${esc(qr.url)}" target="_blank" rel="noopener" title="Passport transaction ${esc(qr.txHash)}">${qr.svg}<span>Scan or click: passport on Cardano Preprod</span></a>`
   : '<div class="qr pending"><span>The QR code appears once this passport is written on-chain (after signing)</span></div>'}
 </div>
 ${aiNote(explanation().ess?.[b.battery_id])}
 <section class="sec"><div class="sec-head"><div><h2>Where the cells came from</h2><p>Hover a pack or module to follow its cells.</p></div></div><div class="sankey-wrap">${sankey}</div></section>
 <section class="sec"><div class="sec-head"><div><h2>All ${esc(b.cells.length)} cells</h2><p>Each square is one cell, coloured by its donor pack. Hover to see it; click a pack to highlight its cells.</p></div></div>
  <div class="mosaic" id="mosaic">${b.cells.map((c, i) => `<div class="cell" data-pack="${esc(c.donor_pack || packOf(c.module_id))}" data-tip="${esc(placeName(c.cell_id))}" style="background:${packColor(c.donor_pack || packOf(c.module_id))};animation-delay:${reduceMotion ? 0 : i * 12}ms"></div>`).join('')}</div>
  <div class="legend">${packs.map(([p, cs]) => `<button type="button" data-legend="${esc(p)}"><span class="dot" style="background:${packColor(p)}"></span>Pack ${esc(p)} · ${esc(cs.length)} cells</button>`).join('')}</div>
 </section>
 <section class="sec"><div class="sec-head"><div><h2>Source documents</h2><p>Each document's fingerprint (SHA-256) is anchored on-chain.</p></div></div>
  <div class="help-grid">${packs.map(([p]) => `<div class="term"><b><span class="dot" style="background:${packColor(p)}"></span> Pack ${esc(p)}</b><ul class="docs">${d.documents.filter(x => x.pack_id === p).map(x => `<li>${esc(x.doc_id)} <span data-tip="${esc(x.sha256)}">${esc(String(x.sha256).slice(0, 10))}…</span>${x.anchor_tx ? ' · anchored' : ''}</li>`).join('')}</ul></div>`).join('')}</div>
 </section>`;
}

function held() {
 const d = current.draft, list = d.held_back || [];
 const mods = list.filter(h => h.level === 'module'), cells = list.filter(h => h.level === 'cell');
 const items = r => `<ul>${reasonItems(r).map(t => `<li>${esc(t)}</li>`).join('')}</ul>`;
 return `
 <h1>Held back</h1>
 <p class="lead">What the code refused to use, and why. Nothing here is deleted: every decision is recorded with its reason so a buyer can check it later.</p>
 ${aiLimitNote()}
 ${d.rejected.length ? `<p class="sub">Claims rejected by verification</p><div class="held-grid">${d.rejected.map(x => `<div class="held-card"><div class="name">Claim ${esc(x.event_id)}${/^[A-Z]-/.test(x.event_id || '') ? ` <span class="muted">· Pack ${esc(x.event_id[0])}</span>` : ''}</div><span class="tag">Rejected</span>${items(x.reason)}</div>`).join('')}</div>` : ''}
 ${mods.length ? `<p class="sub">Modules not taken apart</p><div class="held-grid">${mods.map(h => `<div class="held-card"><div class="name">${esc(placeName(h.id))}</div><span class="tag">Not taken apart</span>${items(h.reason)}${aiNote(explanation().modules?.[h.id])}</div>`).join('')}</div>` : ''}
 ${cells.length ? `<p class="sub">Cells not used</p><div class="held-grid">${groupBy(cells, h => h.reason).map(([reason, hs]) => `<div class="held-card">
   <div class="name">${esc(hs.length)} cell${hs.length === 1 ? '' : 's'}</div><span class="tag">Not used</span>${items(reason)}
   ${[...new Set((explanation().cells || []).filter(g => g.cell_ids.some(id => hs.some(h => h.id === id))).map(g => g.text))].map(aiNote).join('')}
   <div class="cell-groups">${cellsByModule(hs.map(h => h.id)).map(([m, ns]) => `<div class="cell-group"><span class="where">${esc(placeName(m))}</span>${ns.map(n => `<span class="c">Cell ${esc(n)}</span>`).join('')}</div>`).join('')}</div>
  </div>`).join('')}</div>` : ''}
 ${!list.length && !d.rejected.length ? '<p class="muted">Nothing was held back.</p>' : ''}`;
}

function help() {
 const terms = [
  ['Pack, module, cell', 'An EV battery pack is made of modules, and each module of cells. IDs read like <code>A-M2-C07</code>: pack A, module 2, cell 7. This screen writes them as “Pack A · Module 2 · Cell 7”.'],
  ['ESS', 'Energy storage system: a new home or grid battery built from matching used cells.'],
  ['Second-life health (SoH)', 'Usable capacity divided by the cell\'s original capacity. Cells are in series, so the weakest cell sets the value.'],
  ['QR passport', 'Each ESS gets a passport on Cardano. The QR code on the unit opens it: health, facility, and links to every donor pack.'],
  ['Signed', confHelp.signed + '.'],
  ['Documented', confHelp.documented + '.'],
  ['Estimated', confHelp.estimated + '.'],
  ['Warning', 'A rule found a contradiction between events. Modules named in a warning are not taken apart.'],
  ['Rejected claim', 'An event whose quote could not be found word for word in its document. It is left out of the draft.'],
  ['Held back', 'A module that was not taken apart, or a cell that was not used, always with its reason.'],
 ];
 const faq = [
  ['Does the AI decide which cells are used?', 'No. The AI only extracts what documents say. Deterministic code verifies the quotes and groups the cells; a person signs the result.'],
  ['Why is a module held back when only one event mentions it?', 'Grouping is conservative: an accident or an open warning on a module keeps all of its cells out until a person reviews it.'],
  ['Why is the AI explanation short or missing?', 'AI restrictions may limit the explanation for large batch requests: the model accepts only so much input, its quota can run out, and a paid job must finish within its time limit. The draft is still delivered, and the grouping, held-back items, and their reasons are always complete because code decides them.'],
  ['Why is there no QR code on the demo draft?', 'QR codes appear only after a paid draft is signed and its passports are written on-chain. The demo shows a placeholder instead of a fake code.'],
  ['Can I trust the documents themselves?', 'The system proves what a document says, not that the document is true. Signed documents from service shops reduce this risk.'],
 ];
 return `
 <h1>Help</h1>
 <p class="lead">What the words on this screen mean, and how to move around.</p>
 <div class="help-grid">${terms.map(([t, body]) => `<div class="term"><b>${esc(t)}</b>${body}</div>`).join('')}</div>
 <section class="sec"><div class="sec-head"><h2>Questions</h2></div>${faq.map(([q, a]) => `<details class="faq"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</section>

const notFound = () => `<h1>Not found</h1><p class="lead">This page does not exist.</p><a class="pill" href="#/overview">Go to overview</a>`;

// ---------- Interactions ----------

function wire() {
 const signBtn = document.getElementById('sign-btn');
 if (signBtn) signBtn.onclick = sign;

 for (const b of app.querySelectorAll('[data-pack].pill')) b.onclick = () => { packFilter = b.dataset.pack; route(); };

 // Count numbers up on the overview.
 if (!reduceMotion) for (const el of app.querySelectorAll('[data-count]')) {
  const end = Number(el.dataset.count); if (!Number.isFinite(end) || end < 2) continue;
  const t0 = performance.now(), dur = 900;
  const tick = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
 }

 // Cards tilt towards the mouse.
 if (!reduceMotion && matchMedia('(pointer:fine)').matches) for (const el of app.querySelectorAll('.tilt')) {
  el.onmousemove = e => { const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; el.style.transform = `rotateY(${x * 10}deg) rotateX(${-y * 10}deg) translateY(-4px)`; };
  el.onmouseleave = () => { el.style.transform = ''; };
 }

 // Flow diagram: hovering a pack or module lights up its lines.
 const sk = document.getElementById('sankey');
 if (sk) for (const n of sk.querySelectorAll('.node')) {
  n.onmouseenter = () => { const k = n.dataset.k; sk.classList.add('dim'); for (const l of sk.querySelectorAll('.link')) l.classList.toggle('on', k === 'ess' || l.dataset.k.split(' ').includes(k)); };
  n.onmouseleave = () => { sk.classList.remove('dim'); for (const l of sk.querySelectorAll('.link')) l.classList.remove('on'); };
 }

 // Mosaic legend: click a pack to highlight its cells.
 const mo = document.getElementById('mosaic');
 if (mo) for (const btn of app.querySelectorAll('[data-legend]')) btn.onclick = () => {
  const on = !btn.classList.contains('on');
  for (const b of app.querySelectorAll('[data-legend]')) b.classList.remove('on');
  btn.classList.toggle('on', on); mo.classList.toggle('focus', on);
  for (const c of mo.children) c.classList.toggle('lit', on && c.dataset.pack === btn.dataset.legend);
 };
}

// One tooltip for every element with data-tip.
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t && t.dataset.tip) { tip.textContent = t.dataset.tip; tip.classList.add('show'); } });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) tip.classList.remove('show'); });
document.addEventListener('mousemove', e => { tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; });

async function sign() {
 const btn = document.getElementById('sign-btn'), status = document.getElementById('status');
 btn.disabled = true; status.textContent = 'Signing…';
 const res = await fetch('/api/sign', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({id: current.id, changes: document.getElementById('changes').value})});
 const out = await res.json();
 if (!res.ok) { status.textContent = `Not signed: ${out.error}`; btn.disabled = false; return; }
 // Reload so each ESS passport shows the QR code of its new passport.
 await show(current.id);
 document.getElementById('sign-btn').disabled = true;
 document.getElementById('status').textContent = `Signed. Donor log TxHashes: ${out.donorTxs.join(', ')}\nESS log and passport TxHashes: ${out.newBatteryTxs.join(', ')}\nOpen ESS passports to scan the QR codes.`;
}
load();
</script>
