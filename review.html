<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery History Review</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e2e2dc;--accent:#2f6f4e;--warn:#a15c00;--warn-bg:#fff4e0;--bad:#a12b2b;--bad-bg:#fdecec;--chip:#eef2ef;--signed:#2f6f4e;--documented:#2b5ea1;--estimated:#8a5aa8}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ececE8;--muted:#a3a39c;--line:#33332f;--accent:#6cc497;--warn:#f0b35a;--warn-bg:#2e2412;--bad:#f08a8a;--bad-bg:#2e1616;--chip:#262a27;--signed:#6cc497;--documented:#7fb0f0;--estimated:#c79be0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 12px}
select,textarea,button{font:inherit;color:inherit}
select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.stats{display:flex;flex-wrap:wrap;gap:24px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:13px}
.note{padding:10px 12px;border-radius:8px;margin-bottom:8px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.event{border-left:3px solid var(--line);padding:4px 0 10px 12px;margin-left:4px}
.event.flagged{border-left-color:var(--warn)}
.event .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.type{font-weight:600}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px}
.conf{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.conf.signed{color:var(--signed)}.conf.documented{color:var(--documented)}.conf.estimated{color:var(--estimated)}
.fields{font-size:13px;color:var(--muted)}
.quote{font-size:13px;margin-top:2px}
.quote q{font-style:italic}
.tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.donor{border:1px solid var(--line);border-radius:8px;padding:10px}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.mod{border:1px solid var(--accent);border-radius:6px;padding:2px 6px;font-size:12px;font-variant-numeric:tabular-nums}
.mod.held{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.docs{font-size:12px;color:var(--muted);margin:0;padding-left:18px}
.sign{display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:60px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer;align-self:flex-start}
button:disabled{opacity:.5;cursor:not-allowed}
#status{font-size:14px;white-space:pre-wrap;word-break:break-word}
.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
<header>
 <h1>Battery history review</h1>
 <label>Draft <select id="pick"></select></label>
</header>
<div id="app"><p class="muted">Loading…</p></div>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = t => t.replace(/_/g, ' ');
const pick = document.getElementById('pick'), app = document.getElementById('app');
let current;

async function load() {
 const drafts = await (await fetch('/api/drafts')).json();
 pick.innerHTML = drafts.map(d => `<option value="${esc(d.id)}">${esc(d.label)}</option>`).join('');
 if (drafts.length) show(drafts[drafts.length - 1].id); else app.innerHTML = '<p class="muted">No drafts yet.</p>';
 pick.value = drafts.length ? drafts[drafts.length - 1].id : '';
}
pick.onchange = () => show(pick.value);

async function show(id) {
 const r = await (await fetch('/api/draft?id=' + encodeURIComponent(id))).json();
 current = r; const d = r.draft;
 const flagged = new Set(d.warnings.flatMap(w => w.events));
 const docs = Object.fromEntries(d.documents.map(x => [x.doc_id, x]));
 const tests = Object.fromEntries(d.cell_tests.map(c => [c.cell_id, c]));
 const used = d.new_batteries.reduce((n, b) => n + b.cells.length, 0);
 const held = d.new_batteries.reduce((n, b) => n + b.held_back.length, 0);

 const event = e => `<div class="event ${flagged.has(e.event_id) ? 'flagged' : ''}">
  <div class="top"><span class="date">${esc(e.date)}</span><span class="type">${esc(label(e.type))}</span>
  <span class="chip">${esc([...(e.cell_ids || []), ...(e.cell_ids?.length ? [] : e.module_ids || [])].join(', ') || 'whole pack')}</span>
  <span class="conf ${esc(e.confidence)}">${esc(e.confidence)}</span></div>
  <div class="fields">${Object.entries(e.fields || {}).map(([k, v]) => `${esc(label(k))}: ${esc(v)}`).join(' · ')}</div>
  ${e.source ? `<div class="quote"><q>${esc(e.source.quote)}</q> <span class="muted">— ${esc(e.source.doc_id)}, p. ${esc(e.source.page)}, line ${esc(e.source.line)}</span></div>`
   : `<div class="quote muted">Derived from ${esc((e.basis || []).join(', '))}</div>`}
 </div>`;

 const pack = p => `<div><h2>Pack ${esc(p)}</h2>${d.events.filter(e => e.pack_id === p).sort((a, b) => a.date.localeCompare(b.date)).map(event).join('') || '<p class="muted">No events.</p>'}</div>`;

 // Cells are shown under their module, so module-level events (a replacement, an accident) stay visible.
 const cell = (id, reason) => { const t = tests[id]; const tip = (t ? `${t.capacity_ah} Ah, ${t.internal_resistance_mohm} mΩ, ${t.self_discharge_mv_day} mV/day` : '') + (reason ? ` — held back: ${reason}` : '');
  return `<span class="mod ${reason ? 'held' : ''}" title="${esc(tip)}">${esc(id.split('-').pop())}</span>`; };
 const modulesOf = p => [...new Set(d.cell_tests.filter(c => c.cell_id.startsWith(p + '-')).map(c => c.cell_id.split('-').slice(0, 2).join('-')))];
 const battery = b => { const heldBy = Object.fromEntries(b.held_back.map(h => [h.cell_id, h.reason]));
  return `<p><b>${esc(b.battery_id)}</b> — ${b.cells.length} cells${b.cell_model ? ` of ${esc(b.cell_model)}` : ''}. Rules: capacity ±${esc(b.rules.capacity_band_pct)}%, internal resistance ±${esc(b.rules.resistance_band_pct)}%, self-discharge ≤ ${esc(b.rules.max_self_discharge_mv_day)} mV/day. Struck-through cells are held back; hover a cell for its test values.</p>
  <div class="tree">${d.packs.map(p => `<div class="donor"><b>From pack ${esc(p)}</b> <span class="muted">(${b.cells.filter(c => c.donor_pack === p).length} cells used)</span>
   ${modulesOf(p).map(m => `<div class="mods"><span class="chip">${esc(m)}</span>${d.cell_tests.filter(c => c.cell_id.startsWith(m + '-')).map(c => cell(c.cell_id, heldBy[c.cell_id])).join('')}</div>`).join('')}
   <ul class="docs">${d.documents.filter(x => x.pack_id === p).map(x => `<li>${esc(x.doc_id)} <span title="${esc(x.sha256)}">${esc(x.sha256.slice(0, 10))}…</span>${x.anchor_tx ? ` · anchored` : ''}</li>`).join('')}</ul></div>`).join('')}</div>
  ${b.held_back.length ? `<h2 style="margin-top:14px">Held back</h2>${heldGroups(b.held_back).map(g => `<div class="note bad"><b>${esc(g.ids)}</b>: ${esc(g.reason)}</div>`).join('')}` : ''}`; };
 // Collapse whole modules held back for the same event into one line.
 function heldGroups(held) {
  const groups = [];
  for (const h of held) { const m = h.cell_id.split('-').slice(0, 2).join('-'); const key = / on module /.test(h.reason) ? m + '|' + h.reason : h.cell_id;
   const g = groups.find(x => x.key === key); if (g) g.cells.push(h.cell_id); else groups.push({key, module: m, cells: [h.cell_id], reason: h.reason}); }
  return groups.map(g => ({ids: g.cells.length > 1 ? `${g.module} (all ${g.cells.length} cells)` : g.cells[0], reason: g.reason}));
 }

 app.innerHTML = `
 <section><div class="stats">
  <div class="stat"><b>${d.packs.length}</b><span>donor packs</span></div>
  <div class="stat"><b>${d.events.length}</b><span>verified events</span></div>
  <div class="stat"><b>${d.warnings.length}</b><span>warnings</span></div>
  <div class="stat"><b>${d.rejected.length}</b><span>rejected claims</span></div>
  <div class="stat"><b>${used}</b><span>cells regrouped</span></div>
  <div class="stat"><b>${held}</b><span>cells held back</span></div>
 </div></section>
 ${d.warnings.length ? `<section><h2>Warnings</h2>${d.warnings.map(w => `<div class="note warn">${esc(w.message)} <span class="muted">(${esc(w.events.join(', '))})</span></div>`).join('')}</section>` : ''}
 ${d.rejected.length ? `<section><h2>Rejected by verification</h2>${d.rejected.map(x => `<div class="note bad"><b>${esc(x.event_id)}</b>: ${esc(x.reason)}</div>`).join('')}</section>` : ''}
 <section><h2>Donor histories</h2><div class="packs">${d.packs.map(pack).join('')}</div></section>
 <section><h2>New battery family tree</h2>${d.new_batteries.map(battery).join('') || '<p class="muted">No grouping proposed.</p>'}</section>
 <section class="sign"><h2>Sign and publish</h2>
  ${r.paid ? '<p>Signing confirms this draft is the one paid for through Masumi, records your signature, and writes the donor and new-battery event logs on Cardano Preprod.</p>'
   : '<p class="muted">This is the demo draft. Only a paid draft can be signed.</p>'}
  <label>Changes from the draft (optional)<textarea id="changes" placeholder="none"></textarea></label>
  <button id="sign" ${r.paid ? '' : 'disabled'}>Sign and publish</button>
  <div id="status"></div>
 </section>`;
 document.getElementById('sign').onclick = sign;
}

async function sign() {
 const btn = document.getElementById('sign'), status = document.getElementById('status');
 btn.disabled = true; status.textContent = 'Signing…';
 const res = await fetch('/api/sign', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({id: current.id, changes: document.getElementById('changes').value})});
 const out = await res.json();
 status.textContent = res.ok ? `Signed. Donor log TxHashes: ${out.donorTxs.join(', ')}\nNew battery log TxHashes: ${out.newBatteryTxs.join(', ')}` : `Not signed: ${out.error}`;
 btn.disabled = res.ok;
}
load();
</script>
</body>
</html>
