<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery Agent Status</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e2e2dc;--ok:#2f6f4e;--ok-bg:#e9f4ee;--warn:#a15c00;--warn-bg:#fff4e0;--bad:#a12b2b;--bad-bg:#fdecec;--chip:#eef2ef;--link:#2b5ea1}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ececE8;--muted:#a3a39c;--line:#33332f;--ok:#6cc497;--ok-bg:#16261d;--warn:#f0b35a;--warn-bg:#2e2412;--bad:#f08a8a;--bad-bg:#2e1616;--chip:#262a27;--link:#7fb0f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:20px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 12px}
a{color:var(--link)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}
.badge{align-self:flex-start;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted);font-size:13px}
code{background:var(--chip);border-radius:4px;padding:1px 5px;font-size:12px;word-break:break-all}
.kv{display:grid;grid-template-columns:minmax(140px,max-content) 1fr;gap:6px 16px}
.kv div:nth-child(odd){color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<main>
<header>
 <h1>Battery agent status</h1>
 <span class="muted"><a href="/">Review screen</a> · <span id="updated">Loading…</span></span>
</header>
<div id="app"></div>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = (cls, text) => `<span class="badge ${cls}">${esc(text)}</span>`;
const short = (s, n = 10) => s ? `${esc(s.slice(0, n))}…${esc(s.slice(-6))}` : '—';
const ago = iso => { if (!iso) return 'never'; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
const tx = h => h ? `<a href="https://preprod.cardanoscan.io/transaction/${esc(h)}" target="_blank" rel="noopener">${short(h, 8)}</a>` : '—';

function render(s) {
 const m = s.masumi, so = s.sokosumi, c = s.cardano, t = s.team;
 const access = so.status === 'GRANTED' ? badge('ok', 'GRANTED') : so.status === 'PENDING' ? badge('warn', 'PENDING approval') : badge('bad', so.status);
 const reg = m.registration === 'RegistrationConfirmed' ? badge('ok', 'Registered') : badge('warn', m.registration);
 document.getElementById('app').innerHTML = `
 <section><h2>Services on this machine</h2><div class="grid">
  ${s.services.map(x => `<div class="card">${x.up ? badge('ok', 'Running') : badge('bad', 'Stopped')}
   <b>${esc(x.name)}</b><span class="muted">${esc(x.detail)}</span>
   ${x.up ? '' : `<span class="muted">Start: <code>${esc(x.start)}</code></span>`}</div>`).join('')}
 </div></section>

 <section><h2>Masumi (payments)</h2><div class="kv">
  <div>Agent registration</div><div>${reg} ${esc(m.agentName || '')}</div>
  <div>Registration transaction</div><div>${tx(m.registrationTx)}</div>
  <div>Agent identifier</div><div><code>${short(m.agentIdentifier, 16)}</code></div>
  <div>Selling wallet</div><div><code>${short(m.sellerAddress, 16)}</code></div>
  <div>Wallet balance</div><div>${m.wallet ? `${esc(m.wallet.ada)} test ADA · ${esc(m.wallet.usdm)} test USDM` : '<span class="muted">unknown (Blockfrost not reachable)</span>'}</div>
 </div></section>

 <section><h2>Sokosumi</h2><div class="kv">
  <div>Coworker</div><div>${esc(so.coworker)}</div>
  <div>TUM Workspace access</div><div>${access} <span class="muted">last checked ${esc(ago(so.checkedAt))}</span></div>
 </div>
 ${so.status === 'GRANTED' ? '' : '<p class="muted">Tasks in the TUM Workspace start once a Workspace admin (Sandro) approves the access request.</p>'}
 </section>

 <section><h2>Tasks and jobs</h2>
  ${s.tasks.length ? `<div class="scroll"><table><tr><th>Kind</th><th>ID</th><th>Phase</th><th>Payment stage</th><th>Seller paid</th><th>Updated</th></tr>
   ${s.tasks.map(x => `<tr><td>${esc(x.kind)}</td><td><code>${esc(x.id.slice(0, 8))}</code></td><td>${esc(x.phase || '—')}</td><td>${esc(x.paidStage || '—')}</td>
   <td>${x.settled === true ? badge('ok', 'verified') : x.settled === false ? badge('warn', 'not yet') : '—'}</td><td class="muted">${esc(ago(x.updatedAt))}</td></tr>`).join('')}</table></div>`
   : '<p class="muted">No tasks yet. The first one runs once Sokosumi access is granted.</p>'}
 </section>

 <section><h2>Cardano (event logs and passports)</h2><div class="kv">
  <div>On-chain writes</div><div>${c.writesEnabled ? badge('ok', 'Enabled') : badge('warn', 'Off')} <span class="muted">${c.writesEnabled ? '' : 'waiting for the team decision (#5)'}</span></div>
  <div>Company wallet on this machine</div><div>${c.walletConfigured ? badge('ok', 'Configured') : badge('warn', 'Not configured here')}</div>
  <div>Signed drafts</div><div>${esc(c.signedDrafts)}</div>
 </div></section>

 <section><h2>Team: open problems</h2>
  ${t.open.length ? `<div class="scroll"><table><tr><th>#</th><th>Problem</th><th>Owner</th></tr>
   ${t.open.map(p => `<tr><td>${esc(p.n)}</td><td>${esc(p.title)}</td><td>${esc(p.owner)}</td></tr>`).join('')}</table></div>` : '<p class="muted">Nothing open.</p>'}
  <p class="muted">${esc(t.solved)} solved · full list in <code>docs/open-problems.md</code>
  ${t.commit ? ` · latest commit <code>${esc(t.commit.hash)}</code> by ${esc(t.commit.author)}, ${esc(t.commit.when)}: ${esc(t.commit.subject)}` : ''}</p>
 </section>`;
 document.getElementById('updated').textContent = `Updated ${new Date(s.checkedAt).toLocaleTimeString()} · refreshes every 10 s`;
}

async function refresh() {
 try { render(await (await fetch('/api/status')).json()); }
 catch { document.getElementById('updated').textContent = 'Status server not reachable. Is npm run review running?'; }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
